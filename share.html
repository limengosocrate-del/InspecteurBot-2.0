<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#041c5c"><title>Partager vers InspecteurBot</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;display:grid;place-items:center;background:linear-gradient(145deg,#03143b,#073b78);font-family:Arial,sans-serif;color:#fff}main{width:min(100%,520px);padding:26px;border:1px solid #ffffff2b;border-radius:20px;background:#ffffff0d}h1{font-size:24px;margin:0 0 8px}p{color:#dce8ff;line-height:1.5}label{display:block;margin:18px 0 7px;font-weight:700}textarea,input{width:100%;padding:13px;border:1px solid #b8c9e8;border-radius:10px;background:#f7faff;color:#12213c;font:15px Arial}textarea{min-height:120px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}button,a{border:0;border-radius:10px;padding:13px 17px;font-weight:700;text-decoration:none;cursor:pointer;background:#ffd700;color:#071b45}a{background:#ffffff20;color:#fff}#status{min-height:22px;font-size:13px;color:#ffe58a}</style></head><body><main><h1>Partager vers InspecteurBot</h1><p>Le contenu partagé est reçu sur cet appareil. Copiez-le pour le coller dans le menu ou la conversation souhaitée.</p><label for="title">Titre</label><input id="title" readonly><label for="content">Contenu partagé</label><textarea id="content" readonly></textarea><label for="link">Lien</label><input id="link" readonly><div class="actions"><button id="copy" type="button">Copier le contenu</button><a href="./index.html">Ouvrir InspecteurBot</a></div><p id="status" aria-live="polite"></p></main><script>
(()=>{const q=new URLSearchParams(location.search),title=q.get('title')||'',text=q.get('text')||'',url=q.get('url')||'';document.getElementById('title').value=title;document.getElementById('content').value=text;document.getElementById('link').value=url;document.getElementById('copy').addEventListener('click',async()=>{const value=[title,text,url].filter(Boolean).join('\n\n');try{await navigator.clipboard.writeText(value);document.getElementById('status').textContent='Contenu copié. Vous pouvez le coller dans InspecteurBot.'}catch(e){const box=document.getElementById('content');box.focus();box.select();document.getElementById('status').textContent='Sélectionnez le texte puis choisissez Copier.'}})})();
</script></body></html>
