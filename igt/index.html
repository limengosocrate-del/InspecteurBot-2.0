<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<title>Annuaire national IGT — InspecteurBot</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f7fb}
#igt-load-error{max-width:680px;margin:12vh auto;padding:22px;border:1px solid #e4b6b6;border-radius:14px;background:#fff;color:#7f1d1d;font:15px/1.55 Arial,sans-serif;box-shadow:0 8px 30px #12243a12}
#igt-load-error button{margin-top:14px;padding:11px 16px;border:0;border-radius:8px;background:#123d60;color:#fff;font-weight:700}
#ib-igt-startup-splash{position:fixed;inset:0;z-index:2147483647;display:flex;visibility:visible!important;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:24px;background:radial-gradient(circle at 50% 35%,#123f70 0%,#071b34 58%,#031126 100%);color:#fff;text-align:center;font:15px Arial,sans-serif}#ib-igt-startup-splash strong{font-size:clamp(32px,8vw,46px);font-weight:800;letter-spacing:.3px}#ib-igt-startup-splash span{color:#d8eaff;font-size:15px}#ib-igt-startup-splash i{width:28px;height:28px;margin-top:12px;border:3px solid #ffffff40;border-top-color:#ffd700;border-radius:50%;animation:ib-igt-spin .8s linear infinite}@keyframes ib-igt-spin{to{transform:rotate(360deg)}}#ib-igt-startup-splash.ib-hide{opacity:0;pointer-events:none;transition:opacity .22s ease}
</style>
</head>
<body>
<div id="ib-igt-startup-splash" role="status" aria-live="polite"><strong>InspecteurBot</strong><span>Ouverture directe de l’annuaire IGT…</span><i aria-hidden="true"></i></div>
<div id="igt-load-error" role="alert" hidden></div>
<script>
(async function(){
 const startupStarted=Date.now();
 const version='20261112-registration-profile-photo-v5';
 const files=[
  'part-001.txt','part-002.txt',
  'part-003-01.txt','part-003-02.txt','part-003-03.txt','part-003-04.txt','part-003-05.txt',
  'part-003-06.txt','part-003-07.txt','part-003-08.txt','part-003-09.txt','part-003-10.txt',
  'part-004.txt','part-005.txt','part-006.txt','part-007.txt','part-008.txt','part-009.txt','part-010.txt','part-011.txt'
 ];
 try{
  const parts=await Promise.all(files.map(async file=>{
   const response=await fetch('./v13/'+file+'?v='+version,{cache:'default',credentials:'same-origin'});
   if(!response.ok)throw new Error(file+' : réponse HTTP '+response.status);
   const content=await response.text();
   if(!content.trim())throw new Error(file+' : fichier vide');
   return content;
  }));
  let page=parts.join('');
  if(!/<html[\s>]/i.test(page)||!/<body[\s>]/i.test(page)||!page.includes('igt-workspace')){
   throw new Error('Les fragments reçus ne forment pas l’annuaire complet.');
  }
  if(page.includes('id="igt-minimum-loader"')){
   throw new Error('L’ancien écran de chargement est encore présent dans les fragments.');
  }
  page=page.replace(/<meta name="viewport"[^>]*>/i,'<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">');
  page=page.replace(/<title[^>]*>[\s\S]*?<\/title>/i,'<title>Annuaire national IGT — InspecteurBot</title>');
  const startupStyle='<style id="ib-igt-startup-style">#ib-igt-startup-splash{position:fixed;inset:0;z-index:2147483647;display:flex;visibility:visible!important;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:24px;background:radial-gradient(circle at 50% 35%,#123f70 0%,#071b34 58%,#031126 100%);color:#fff;text-align:center;font:15px Arial,sans-serif}#ib-igt-startup-splash strong{font-size:clamp(32px,8vw,46px);font-weight:800;letter-spacing:.3px}#ib-igt-startup-splash span{color:#d8eaff;font-size:15px}#ib-igt-startup-splash i{width:28px;height:28px;margin-top:12px;border:3px solid #ffffff40;border-top-color:#ffd700;border-radius:50%;animation:ib-igt-spin .8s linear infinite}@keyframes ib-igt-spin{to{transform:rotate(360deg)}}#ib-igt-startup-splash.ib-hide{opacity:0;pointer-events:none;transition:opacity .22s ease}</style>';
  page=page.replace('</head>',startupStyle+'\n</head>');
  page=page.replace(/<body([^>]*)>/i,'<body$1><div id="ib-igt-startup-splash" role="status" aria-live="polite"><strong>InspecteurBot</strong><span>Ouverture de votre espace IGT sécurisé…</span><i aria-hidden="true"></i></div>');
  page=page.replace('</body>','<script>(function(){const splash=document.getElementById("ib-igt-startup-splash");if(!splash)return;const started='+startupStarted+';let done=false;function finish(){if(done||document.body.classList.contains("igt-auth-pending"))return;done=true;const wait=0;setTimeout(()=>{splash.classList.add("ib-hide");setTimeout(()=>splash.remove(),260)},wait)}const observer=new MutationObserver(finish);observer.observe(document.body,{attributes:true,attributeFilter:["class"]});finish();setTimeout(()=>{if(!done){const label=splash.querySelector("span");if(label)label.textContent="Connexion à votre espace sécurisé…";}},7000);setTimeout(()=>{if(!done){const label=splash.querySelector("span");if(label)label.textContent="Le chargement prend plus de temps que prévu. Vérifiez votre connexion puis réessayez.";const retry=document.createElement("button");retry.type="button";retry.textContent="Réessayer";retry.style.cssText="margin-top:10px;padding:10px 16px;border:0;border-radius:9px;background:#ffd700;color:#071b35;font-weight:700";retry.addEventListener("click",()=>location.reload());splash.appendChild(retry);}},15000);})();<\/script></body>');
  const scroll='<style id="inspecteurbot-touch-scroll">html,body{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important;touch-action:pan-y!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior-y:auto!important;scroll-behavior:auto!important}body{position:relative!important}</style>';
  if(!/<base\b/i.test(page))page=page.replace('</head>','<base href="./">\n'+scroll+'\n</head>');
  else page=page.replace(/<base\b[^>]*>/i,'<base href="./">').replace('</head>',scroll+'\n</head>');
  document.open();document.write(page);document.close();
 }catch(error){
  console.error('Ouverture directe de l’annuaire IGT :',error);
  const box=document.getElementById('igt-load-error');
  box.hidden=false;
  box.textContent='Impossible d’ouvrir l’annuaire IGT. '+(error&&error.message?error.message:'Vérifiez votre connexion puis réessayez.');
  const retry=document.createElement('button');retry.type='button';retry.textContent='Réessayer';retry.addEventListener('click',()=>location.reload());box.appendChild(document.createElement('br'));box.appendChild(retry);
 }
})();
</script>
</body>
</html>
