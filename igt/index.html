<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082b4c">
<title>Annuaire national IGT — InspecteurBot</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;background:#071b35;font-family:Arial,sans-serif}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:white;background:radial-gradient(circle at 50% 35%,#123f70,#071b35 65%,#031126);font-weight:800;z-index:10}
#spin{width:32px;height:32px;border:3px solid #ffffff40;border-top-color:#e6b63f;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#hint{font-size:12px;font-weight:500;color:#d8e8f5;text-align:center;padding:0 18px}
</style></head><body>
<div id="load"><div id="spin"></div><div>InspecteurBot — Annuaire national IGT</div><div id="hint">Chargement du contenu officiel de l’annuaire…</div></div>
<script>
(async()=>{
 const version='20261109-v13-workspace-visible-fix2';
 const names=Array.from({length:11},(_,i)=>'part-'+String(i+1).padStart(3,'0')+'.txt?v='+version);
 const hint=document.getElementById('hint');
 const loader=document.getElementById('load');
 const spin=document.getElementById('spin');
 try{
  let completed=0;
  const parts=await Promise.all(names.map(async name=>{
   const controller=new AbortController();
   const timeout=setTimeout(()=>controller.abort(),90000);
   try{
    const response=await fetch('./v13/'+name,{cache:'force-cache',credentials:'same-origin',signal:controller.signal});
    if(!response.ok)throw new Error('Chargement de '+name.split('?')[0]+' impossible (HTTP '+response.status+').');
    const content=await response.text();
    completed++;
    hint.textContent='Chargement de l’annuaire : '+completed+' / '+names.length+' fichiers…';
    return content;
   }catch(fetchError){
    if(fetchError&&fetchError.name==='AbortError')throw new Error('Le fichier '+name.split('?')[0]+' met trop de temps à répondre. Vérifiez votre connexion puis réessayez.');
    throw fetchError;
   }finally{clearTimeout(timeout);}
  }));
  let page=parts.join('');
  if(!/<html[\s>]/i.test(page)||!/<body[\s>]/i.test(page)||!page.includes('igt-workspace')){
   throw new Error('Le contenu de l’annuaire est incomplet ou mal assemblé.');
  }
  page=page.replace(/<meta name="viewport"[^>]*>/i,'<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">');
  page=page.replace(/<title[^>]*>[\s\S]*?<\/title>/i,'<title>Annuaire national IGT — Version 13 restaurée | InspecteurBot</title>');
  const scroll='<style id="inspecteurbot-touch-scroll">html,body{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important;touch-action:pan-y!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior-y:auto!important;scroll-behavior:auto!important}body{position:relative!important}.shell,.main{min-height:100%;min-width:0}</style>';
  if(!/<base\b/i.test(page))page=page.replace('</head>','<base href="./">\n'+scroll+'\n</head>');
  else page=page.replace('</head>',scroll+'\n</head>');
  const themeLink='<link rel="stylesheet" href="../global-theme.css?v=20261108-theme-5">';
  const themeScript='<script src="../global-theme.js?v=20261108-theme-5" defer>'+'<'+'/script>';
  const publicThemeStyle='<style id="igt-public-directory-mode">#igt-auth-gate,#igt-auth-user,#igt-agent-tools,#igt-open-admin,#igt-inbox,#igt-registration-panel{display:none!important}#igt-workspace{display:block!important;visibility:visible!important;opacity:1!important}body.igt-auth-pending{overflow:auto!important}</style>';
  const staticAuth='<script id="igt-supabase-auth">(function(){document.body.classList.remove("igt-auth-pending");document.body.classList.add("igt-session-ready","light-theme");document.body.dataset.publicTheme="true";var gate=document.getElementById("igt-auth-gate");if(gate)gate.hidden=true;var userBox=document.getElementById("igt-auth-user");if(userBox)userBox.hidden=true;var tools=document.getElementById("igt-agent-tools");if(tools)tools.hidden=true;})();<'+'/script>';
  page=page.replace(/<script id="igt-supabase-auth">[\s\S]*?<\/script>/i,staticAuth);
  page=page.replace('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>','');
  const staticAdminShim='<script id="igt-annuaire-v3-registration-and-admin">(function(){window.loadDirectoryPhone=function(agent){var key=String(agent&&agent.matricule_transcrit||"").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").replace(/[^a-z0-9]/gi,"").toUpperCase();document.querySelectorAll("[data-igt-phone]").forEach(function(node){var current=String(node.getAttribute("data-igt-phone")||"").replace(/[^a-z0-9]/gi,"").toUpperCase();if(!key||current===key)node.textContent="Non renseigné";});};})();<'+'/script>';
  page=page.replace(/<script id="igt-annuaire-v3-registration-and-admin">[\s\S]*?<\/script>/i,staticAdminShim);
  page=page.replace('</head>',themeLink+themeScript+publicThemeStyle+'</head>');
  document.open();document.write(page);document.close();
 }catch(error){
  console.error('Chargement Annuaire IGT :',error);
  hint.textContent=(error&&error.message)||'Erreur de chargement. Rechargez la page.';
  spin.style.display='none';
  let retry=document.getElementById('igt-retry-load');
  if(!retry){retry=document.createElement('button');retry.id='igt-retry-load';retry.type='button';retry.textContent='Réessayer le chargement';retry.style.cssText='padding:13px 20px;border:0;border-radius:10px;background:#e6b63f;color:#09243e;font-weight:800;font-size:15px';loader.appendChild(retry);retry.addEventListener('click',()=>location.reload());}
 }
})();
</script></body></html>
