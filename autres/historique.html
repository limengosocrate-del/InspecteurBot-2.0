<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historique — InspecteurBot RDC</title>
<link rel="stylesheet" href="../fiche.css?v=41">
<link rel="stylesheet" href="decompte-final.css?v=1">

<!-- InspecteurBot : authentification obligatoire Supabase -->
<style id="inspecteurbot-auth-lock">html:not(.inspecteur-auth-ready) body > *:not(#ib-auth-gate){visibility:hidden!important}</style>
<script src="../auth-gate.js?v=20261107-auth-smooth-12" defer></script>
<style>
body{background:#f2f5f9!important;color:#17243b!important}
.header{background:linear-gradient(115deg,#102e50,#1d568d)!important;border-bottom:3px solid #b68a32!important;box-shadow:0 8px 24px rgba(18,42,74,.12)!important}
.header h1,.header h2{color:#fff!important}
.df-main{width:min(1200px,calc(100% - 24px))!important;margin:24px auto!important}
.df-form-section,.hist-item,.info-card{background:#fff!important;color:#17243b!important;border:1px solid #dce4ef!important;border-radius:14px!important;box-shadow:0 5px 18px rgba(25,45,75,.05)!important}
.hist-item{padding:16px!important;margin:10px 0!important;display:flex!important;justify-content:space-between!important;gap:12px!important;flex-wrap:wrap!important}
.hist-item strong{color:#174a78!important}
#filtre{background:#fff!important;color:#17243b!important;border:1px solid #d6dfeb!important;border-radius:10px!important}
@media(max-width:640px){.header{padding:14px!important}.header h1{font-size:18px!important}.hist-item{display:block!important}.hist-item div+div{margin-top:7px!important}}
</style>
</head>
<body>
<div class="background"></div>
<div class="particles"></div>

<header class="header">
  <div class="header-left">
    <div class="logo"><img src="../assets/images/logo-igt.png" alt="IGT"></div>
    <div class="header-text">
      <h1>🗂️ MES ARCHIVES PERSONNELLES</h1>
      <h2>Historique privé enregistré sur cet appareil pour votre compte</h2>
    </div>
  </div>
  <div class="header-right"><a href="../index.html" class="btn-retour">← Retour</a></div>
</header>

<main class="df-main">
  <div class="df-form-section">
    <div class="smig-search" style="display:flex; gap:10px;">
      <input type="text" id="filtre" placeholder="🔎 Filtrer..." style="flex:1; padding:10px; border-radius:6px; border:1px solid #FFD700; background:rgba(0,0,0,0.3); color:#fff;">
      <button class="btn-primary" onclick="render()">🔍</button>
      <button class="btn-secondary" onclick="exportAll()">📥 Exporter tout</button>
      <button class="tool-btn" style="background:#dc3545; color:#fff;" onclick="clearAll()">🗑️ Vider</button>
    </div>
  </div>

  <div id="listBody"></div>
</main>

<script src="../js/history.js?v=2"></script>
<script>
function safeRead(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback;}catch(e){console.warn('Archive illisible :',key,e);return fallback;}}
function safeText(v,fallback=''){return v==null?fallback:String(v);}
function render() {
  const pvStore=safeRead(HISTORY.keyFor("inspecteurbot_pv_rdc_v1"),{records:[]});
  const pv=(Array.isArray(pvStore.records)?pvStore.records:[]).map(r=>({type:"Procès-verbal",desc:safeText(r.number||r.title||r.companyName,"Projet de PV"),date:r.updatedAt||r.createdAt||r.date||new Date().toISOString(),data:r}));
  const dfStore=safeRead(HISTORY.keyFor("inspecteurbot_v1"),{archives:[]});
  const decompteFinals=(Array.isArray(dfStore.archives)?dfStore.archives:[]).map(d=>({type:"Décompte Final",desc:safeText(d.id||d.numero||d.result?.travailleur?.nomComplet,"Décompte enregistré"),date:d.date||d.createdAt||new Date().toISOString(),data:d}));
  const decomptes=safeRead(HISTORY.keyFor("igt_decomptes"),[]).map(d=>({type:"Décompte Final",desc:safeText(d.numero,"Décompte")+" — "+safeText(d.travailleur?.nomComplet,"Travailleur non renseigné")+" (NET : "+(Number(d.netAPayer)||0).toLocaleString("fr-FR")+" FC)",date:d.dateEmission||d.createdAt||new Date().toISOString(),data:d}));
  const missions=safeRead(HISTORY.keyFor("igt_missions"),[]).map(m=>({type:"Mission GPS",desc:safeText(m.nom,"Mission")+" @ "+(Number.isFinite(Number(m.lat))?Number(m.lat).toFixed(4):"—")+","+(Number.isFinite(Number(m.lng))?Number(m.lng).toFixed(4):"—"),date:m.timestamp||m.createdAt||new Date().toISOString(),data:m}));
  const conv=safeRead(HISTORY.keyFor("igt_ai_memory"),[]).map(c=>({type:"IA",desc:safeText(c.q||c.question,"Échange IA").substring(0,80),date:c.ts||c.timestamp||new Date().toISOString(),data:c}));
  const hist=HISTORY.getAll().map(h=>({type:safeText(h.type,"Activité"),desc:safeText(h.description,""),date:h.timestamp||h.date||new Date().toISOString(),data:h.data||h}));
  const all=[...pv,...decompteFinals,...decomptes,...missions,...conv,...hist].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const filtre=document.getElementById("filtre").value.toLowerCase();
  const filtered=filtre?all.filter(x=>x.type.toLowerCase().includes(filtre)||x.desc.toLowerCase().includes(filtre)):all;
  const box=document.getElementById("listBody");
  const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  if(!filtered.length){box.innerHTML="<div class='info-card' style='background:rgba(255,215,0,.1);padding:15px;color:#fff'>Aucune activité enregistrée pour ce compte.</div>";return;}
  box.innerHTML="<div class='df-resultats'><h2 style='color:#FFD700'>📋 "+filtered.length+" entrée(s)</h2>"+filtered.slice(0,200).map(x=>"<div class='hist-item'><div><strong style='color:#FFD700'>["+esc(x.type)+"]</strong> "+esc(x.desc)+"</div><div style='font-size:12px;color:#ccc'>"+esc(new Date(x.date).toLocaleString("fr-FR"))+"</div></div>").join("")+"</div>";
}
function exportAll() {
  const pvStore = JSON.parse(localStorage.getItem(HISTORY.keyFor("inspecteurbot_pv_rdc_v1")) || '{"records":[]}');
  const pv = pvStore.records || [];
  const dfStore = JSON.parse(localStorage.getItem(HISTORY.keyFor("inspecteurbot_v1")) || '{"archives":[]}');
  const decompteFinals = dfStore.archives || [];
  const decomptes = JSON.parse(localStorage.getItem(HISTORY.keyFor("igt_decomptes")) || "[]");
  const missions = JSON.parse(localStorage.getItem(HISTORY.keyFor("igt_missions")) || "[]");
  const conv = JSON.parse(localStorage.getItem(HISTORY.keyFor("igt_ai_memory")) || "[]");
  const hist = HISTORY.getAll();
  const data = { pv, decompteFinals, decomptes, missions, conv, hist, exportDate: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `historique_igt_${Date.now()}.json`;
  a.click();
}
function clearAll() {
  if (!confirm("⚠️ Effacer TOUT l'historique ? Cette action est irréversible.")) return;
  localStorage.removeItem(HISTORY.keyFor("inspecteurbot_pv_rdc_v1"));
  localStorage.removeItem(HISTORY.keyFor("inspecteurbot_v1"));
  localStorage.removeItem(HISTORY.keyFor("igt_decomptes"));
  localStorage.removeItem(HISTORY.keyFor("igt_missions"));
  localStorage.removeItem(HISTORY.keyFor("igt_ai_memory"));
  localStorage.removeItem(HISTORY.keyFor("igt_historique"));
  render();
}
document.getElementById("filtre").addEventListener("input", render);
HISTORY.ready.then(render);
</script>
</body>
</html>
