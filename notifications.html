<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#07518a"><title>Notifications | InspecteurBot</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#18314d;font-family:Arial,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:15px clamp(14px,4vw,40px);background:#fff;border-bottom:1px solid #e3ebf2;box-shadow:0 2px 10px #173b5c0a}
.back{color:#07518a;text-decoration:none;font-weight:700;white-space:nowrap}.brand{flex:1;color:#073b70;font-size:21px;font-weight:800}.brand small{display:block;margin-top:3px;color:#0754a0;font-size:12px;font-weight:500;font-style:italic}
main{width:min(900px,calc(100% - 28px));margin:24px auto 50px}.heading{display:flex;align-items:center;gap:13px;margin-bottom:18px}.heading-icon{width:48px;height:48px;border-radius:14px;background:#e5f2fa;color:#087ca7;display:grid;place-items:center;font-size:22px}h1{margin:0;color:#123d68;font-size:24px}.sub{margin:5px 0 0;color:#6c7f91;font-size:14px}
.panel{margin:14px 0;padding:18px;background:#fff;border:1px solid #e2eaf1;border-radius:16px;box-shadow:0 5px 18px #123d6808}.panel h2{display:flex;align-items:center;gap:9px;margin:0 0 14px;color:#123d68;font-size:17px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{padding:9px 14px;border:1px solid #d6e2ec;border-radius:30px;background:#fff;color:#36566e;font-weight:700}.tab.active{background:#07518a;color:#fff;border-color:#07518a}.tab-count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:20px;background:#d12f45;color:#fff;font-size:11px}.tab.active .tab-count{background:#fff;color:#07518a}
.item{margin:10px 0;padding:14px;border:1px solid #e5edf3;border-radius:12px;background:#fff}.item-head{display:flex;align-items:flex-start;gap:10px}.item-title{flex:1;color:#173b5c;font-weight:700}.item-time{color:#8191a1;font-size:11px;white-space:nowrap}.item-body{margin:9px 0;color:#52677a;font-size:14px;line-height:1.55;white-space:pre-wrap}.meta{color:#8091a0;font-size:12px}
.empty{padding:28px 12px;text-align:center;color:#73869a}.empty i{display:block;margin-bottom:10px;color:#b6c8d7;font-size:30px}
form{display:grid;gap:10px}input,textarea,select{width:100%;padding:12px;border:1px solid #d4e0e9;border-radius:10px;background:#fff;color:#18314d;font:inherit}textarea{min-height:105px;resize:vertical}.primary{padding:12px 16px;border:0;border-radius:10px;background:#07518a;color:#fff;font-weight:700}.primary:disabled{opacity:.6}.notice{min-height:18px;color:#138a65;font-size:13px}
[hidden]{display:none!important}
@media(max-width:520px){header{padding:13px}.brand{font-size:18px}.back{font-size:12px}main{margin-top:18px}.panel{padding:14px}h1{font-size:21px}.item-head{flex-wrap:wrap}.item-time{width:100%}}
</style>
<style id="inspecteurbot-auth-lock">
html:not(.inspecteur-auth-ready) body>*:not(#ib-auth-gate):not(#ib-startup-splash){visibility:hidden!important}
html:not(.inspecteur-auth-ready) body::before{content:"InspecteurBot";position:fixed;inset:0;z-index:2147482998;display:grid;place-items:center;padding:0 20px 74px;background:radial-gradient(circle at 50% 35%,#123f70 0%,#071b34 58%,#031126 100%);color:#fff;font:800 clamp(30px,7vw,44px) Arial,sans-serif;letter-spacing:.2px;visibility:visible!important}
html:not(.inspecteur-auth-ready) body::after{content:"";position:fixed;left:calc(50% - 16px);top:calc(50% + 16px);z-index:2147482998;width:28px;height:28px;border:3px solid #ffffff40;border-top-color:#ffd700;border-radius:50%;animation:ib-first-paint-spin .8s linear infinite;visibility:visible!important}
@keyframes ib-first-paint-spin{to{transform:rotate(360deg)}}
html.inspecteur-auth-ready body::before,html.inspecteur-auth-ready body::after{display:none!important}
</style>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin>
<script src="auth-gate.js?v=20261115-shared-session-v23" defer></script>
<style id="inspecteurbot-touch-scroll">html,body{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important;touch-action:pan-y!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior-y:auto!important;scroll-behavior:auto!important}body{position:relative!important;min-height:100vh!important}@media(max-width:760px){body{min-height:100dvh!important}}</style>
</head><body>
<header><a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Accueil</a><div class="brand">InspecteurBot<small>Votre assistant numérique</small></div></header>
<main>
<div class="heading"><div class="heading-icon"><i class="fa-regular fa-bell"></i></div><div><h1>Centre de notifications</h1><p class="sub">Annonces officielles et formations publiées par l’administration</p></div></div>
<section class="panel"><div class="tabs"><button class="tab active" data-tab="all" type="button">Tout</button><button class="tab" data-tab="announcements" type="button">Annonces</button><button class="tab" data-tab="training" type="button">Formations</button><button class="tab" data-tab="requests" type="button" id="requestsTab" hidden>Demandes de certification <span id="requestsUnread" class="tab-count"></span></button></div><div style="display:flex;justify-content:flex-end;margin:-2px 0 12px"><button type="button" class="primary" id="refreshNotificationCenter"><i class="fa-solid fa-rotate"></i> Actualiser</button></div><div id="notificationList"><div class="empty"><i class="fa-regular fa-bell-slash"></i>Aucune annonce ou notification.</div></div></section>

<section class="panel" id="adminPanel" hidden><h2><i class="fa-solid fa-bullhorn"></i> Publier une annonce officielle</h2><form id="announcementForm"><input id="announcementTitle" maxlength="180" required placeholder="Titre de l’annonce"><textarea id="announcementBody" maxlength="5000" required placeholder="Contenu de l’annonce…"></textarea><button class="primary" id="publishAnnouncement" type="submit">Publier l’annonce</button><div class="notice" id="announcementStatus" aria-live="polite"></div></form></section>
</main>
<script>
(function(){
'use strict';
const ADMIN_ID='ed2f76c7-4867-4689-8500-b45d6e9b14b2';
let client,user,profile,isAdmin=false,announcements=[],training=[],requests=[],tab='all',started=false,loadSequence=0,loadInFlight=false,loadQueued=false,lastLoadAt=0;const readAnnouncements=new Set(),readTraining=new Set(),readRequests=new Set();
const CACHE_PREFIX='inspecteurbot_notifications_cache_v9_';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>new Date(s).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'});
function status(id,t,ok){$(id).textContent=t;$(id).style.color=ok?'#138a65':'#b42318'}
function empty(t){return '<div class="empty"><i class="fa-regular fa-bell-slash"></i>'+esc(t)+'</div>'}
async function load(force=false){
 if(!client||!user)return;
 if(loadInFlight){if(force)loadQueued=true;return;}
 if(!force&&Date.now()-lastLoadAt<700)return;
 loadInFlight=true;lastLoadAt=Date.now();
 const seq=++loadSequence,list=$('notificationList');
 if(!announcements.length&&!training.length&&!requests.length)list.innerHTML='<div class="empty" role="status"><i class="fa-solid fa-spinner fa-spin"></i>Chargement des notifications…</div>';
 const run=async(label,query)=>{try{const r=await query;if(r.error)throw r.error;return {data:r.data||[],error:null}}catch(error){console.error('InspecteurBot '+label,error);return {data:[],error}}};
 const admin=user?.id===ADMIN_ID||['admin','super_admin'].includes(String(profile?.role||'').toLowerCase());
 try{
  const [ann,course,req]=await Promise.all([
   run('annonces',(()=>{let q=client.from('announcements').select('*').order('created_at',{ascending:false}).limit(150);q=q.or('target_user_id.is.null,target_user_id.eq.'+user.id+',created_by.eq.'+user.id);return q})()),
   run('formations',client.from('training_resources').select('*').eq('published',true).order('created_at',{ascending:false}).limit(100)),
   admin?run('demandes de certification',client.from('registration_requests').select('*').eq('statut','en_attente').order('created_at',{ascending:false}).limit(250)):Promise.resolve({data:[],error:null})
  ]);
  if(seq!==loadSequence)return;
  const errors=[];
  if(!ann.error)announcements=ann.data;else errors.push('annonces');
  if(!course.error)training=course.data;else errors.push('formations');
  if(admin&&!req.error)requests=req.data;else if(admin&&req.error)errors.push('demandes de certification');
  const [readA,readT,readR]=await Promise.all([
   run('lectures annonces',client.from('announcement_reads').select('announcement_id').eq('user_id',user.id).limit(500)),
   run('lectures formations',client.from('training_resource_reads').select('resource_id').eq('user_id',user.id).limit(500)),
   admin?run('lectures demandes',client.from('admin_certification_reads').select('request_id').eq('user_id',user.id).limit(300)):Promise.resolve({data:[],error:null})
  ]);
  if(seq!==loadSequence)return;
  if(!readA.error){readAnnouncements.clear();readA.data.forEach(x=>readAnnouncements.add(String(x.announcement_id)))}else errors.push('lectures annonces');
  if(!readT.error){readTraining.clear();readT.data.forEach(x=>readTraining.add(String(x.resource_id)))}else errors.push('lectures formations');
  if(admin&&!readR.error){readRequests.clear();readR.data.forEach(x=>readRequests.add(String(x.request_id)))}else if(admin&&readR.error)errors.push('lectures demandes');
  try{localStorage.setItem(CACHE_PREFIX+user.id,JSON.stringify({announcements,training,readAnnouncements:[...readAnnouncements],readTraining:[...readTraining],savedAt:Date.now()}))}catch(_){}
  render();
  if(errors.length){
   const msg=document.createElement('div');msg.className='item';msg.setAttribute('role','status');
   const strong=document.createElement('strong');strong.textContent='Synchronisation partielle';
   const detail=document.createElement('div');detail.className='item-body';detail.textContent='Certaines données ne sont pas accessibles : '+errors.join(', ')+'. Réessayez avec Actualiser.';
   msg.append(strong,detail);list.prepend(msg);
  }
 }finally{
  loadInFlight=false;
  if(loadQueued){loadQueued=false;setTimeout(()=>load(true).catch(e=>console.warn('Actualisation en attente',e)),80)}
 }
}
function render(){
 const ann=announcements.filter(x=>(!x.target_user_id||x.target_user_id===user?.id)&&!readAnnouncements.has(String(x.id))).map(x=>({kind:'announcement',id:String(x.id),date:x.created_at,title:x.title,body:x.body,meta:'Annonce officielle'}));
 const courses=training.filter(x=>!readTraining.has(String(x.id))).map(x=>({kind:'training',id:String(x.id),date:x.created_at,title:x.title,body:x.description||((x.kind==='audio')?'Communication audio publiée.':(x.kind==='pdf')?'Document de formation publié.':'Nouvelle ressource pédagogique publiée.'),meta:'Formation • '+String(x.kind||'ressource').toUpperCase(),url:(/^https?:\/\//i.test(x.external_url||'')?x.external_url:null)}));
 let items=ann.concat(courses).sort((x,y)=>new Date(y.date)-new Date(x.date));
 if(tab==='announcements')items=items.filter(x=>x.kind==='announcement');
 if(tab==='training')items=items.filter(x=>x.kind==='training');
 const certificationNotice=!isAdmin&&profile?.certification_status!=='certified'?'<article class="item" role="alert" style="border:2px solid #d5a52b;background:#fff8e7"><div class="item-head"><div class="item-title" style="color:#754d00;font-size:16px"><i class="fa-solid fa-shield-halved"></i> CERTIFICATION OBLIGATOIRE</div><span class="item-time" style="color:#9a6500;font-weight:800">À traiter</span></div><div class="item-body" style="color:#654d1d;font-size:15px;font-weight:600">Votre compte n’est pas encore certifié. Vérifiez vos informations professionnelles, ajoutez votre photo si nécessaire et soumettez votre demande à l’administration. Cette notification reste visible jusqu’à la certification.</div><a class="primary" href="profil.html?certification=required#parametres" style="display:inline-block;margin-top:6px;text-decoration:none">ACCÉDER À LA CERTIFICATION</a></article>':'';
 const cards=items.map(x=>'<article class="item" data-read-state="unread" style="border-left:4px solid #087ca7"><div class="item-head"><div class="item-title">'+(x.kind==='announcement'?'<i class="fa-solid fa-bullhorn"></i> ':'<i class="fa-solid fa-graduation-cap"></i> ')+esc(x.title)+' <span style="color:#087ca7;font-size:11px">NOUVEAU</span></div><time class="item-time">'+esc(date(x.date))+'</time></div><div class="item-body">'+esc(x.body)+'</div><div class="meta">'+esc(x.meta)+'</div>'+(x.kind==='training'?(x.url?'<a class="primary" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin-top:10px;text-decoration:none">Ouvrir la ressource</a>':'<a class="primary" href="formation.html" style="display:inline-block;margin-top:10px;text-decoration:none">Accéder au menu Formation</a>'):'')+'<button type="button" class="primary" data-mark-read="'+x.kind+'" data-id="'+esc(x.id)+'" style="display:block;margin-top:10px">Marquer comme lu</button></article>').join('');
 const unreadRequests=requests.filter(x=>!readRequests.has(String(x.id)));
 const reqCards=unreadRequests.map(x=>{const id=String(x.id);return '<article class="item" style="border-left:4px solid #c18a11"><div class="item-head"><div class="item-title"><i class="fa-solid fa-user-shield"></i> '+esc(x.nom_complet||'Nouvelle demande de certification')+' <span style="color:#b17a00;font-size:11px">NOUVELLE DEMANDE</span></div><time class="item-time">'+esc(date(x.created_at))+'</time></div><div class="item-body">Matricule : '+esc(x.matricule||'Non renseigné')+'\nE-mail : '+esc(x.email||'Non renseigné')+'\nCatégorie : '+esc(x.categorie||'Non renseignée')+'</div><div class="meta">Demande en attente de vérification</div><a class="primary" href="admin.html" style="display:inline-block;margin-top:10px;text-decoration:none">Ouvrir la vérification</a><button type="button" class="primary" data-mark-read="request" data-id="'+esc(id)+'" style="display:block;margin-top:10px">Marquer comme lue</button></article>'}).join('');
 if($('requestsTab')){$('requestsTab').hidden=!isAdmin;$('requestsUnread').textContent=String(unreadRequests.length);$('requestsUnread').hidden=unreadRequests.length===0;}
 const showAdminRequests=tab==='requests'||(tab==='all'&&isAdmin);
 const regularEmpty=empty(tab==='training'?'Aucune formation non lue.':tab==='announcements'?'Aucune annonce non lue.':'Aucune notification non lue.');
 const hasContent=Boolean(cards)||(showAdminRequests&&Boolean(reqCards));
 $('notificationList').innerHTML=tab==='requests'?(reqCards||empty('Aucune demande de certification non lue.')):(certificationNotice+(hasContent?cards+(showAdminRequests?reqCards:''):regularEmpty));
}
async function markRead(kind,id){
 const set=kind==='announcement'?readAnnouncements:kind==='training'?readTraining:readRequests;
 if(set.has(String(id)))return;
 let result;
 if(kind==='announcement')result=await client.from('announcement_reads').insert({announcement_id:Number(id),user_id:user.id});
 else if(kind==='training')result=await client.from('training_resource_reads').insert({resource_id:id,user_id:user.id});
 else result=await client.from('admin_certification_reads').insert({request_id:Number(id),user_id:user.id});
 if(result?.error&&result.error.code!=='23505')throw result.error;
 set.add(String(id));render();window.dispatchEvent(new CustomEvent('inspecteurbot:notifications-read'));
}

function init(d){
 if(started)return;started=true;client=d.client;user=d.user;profile=d.profile;isAdmin=user?.id===ADMIN_ID||['admin','super_admin'].includes(String(profile?.role||'').toLowerCase());
 if(isAdmin){$('adminPanel').hidden=false;$('requestsTab').hidden=false;}
 document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()}));$('refreshNotificationCenter').addEventListener('click',async e=>{const b=e.currentTarget;b.disabled=true;b.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Actualisation…';try{await load(true)}catch(err){console.error(err);alert('Actualisation impossible. Vérifiez votre connexion.')}finally{b.disabled=false;b.innerHTML='<i class="fa-solid fa-rotate"></i> Actualiser'}});$('notificationList').addEventListener('click',async e=>{const b=e.target.closest('[data-mark-read]');if(!b)return;b.disabled=true;try{await markRead(b.dataset.markRead,b.dataset.id)}catch(err){console.error(err);b.disabled=false;alert('Impossible de confirmer la lecture. Vérifiez votre connexion puis réessayez.')}});
 if(isAdmin)$('announcementForm').addEventListener('submit',async e=>{
  e.preventDefault();const title=$('announcementTitle').value.trim(),body=$('announcementBody').value.trim();if(!title||!body)return;
  const b=$('publishAnnouncement');b.disabled=true;status('announcementStatus','Publication en cours…',true);
  try{const {error}=await client.from('announcements').insert({title,body,created_by:user.id,target_user_id:null});if(error)throw error;$('announcementTitle').value='';$('announcementBody').value='';status('announcementStatus','Annonce publiée avec succès.',true);await load(true)}
  catch(e){status('announcementStatus',e.message||'Publication impossible.',false)}finally{b.disabled=false}
 });
 try{const cached=JSON.parse(localStorage.getItem(CACHE_PREFIX+user.id)||'null');if(cached){announcements=Array.isArray(cached.announcements)?cached.announcements:[];training=Array.isArray(cached.training)?cached.training:[];(cached.readAnnouncements||[]).forEach(x=>readAnnouncements.add(String(x)));(cached.readTraining||[]).forEach(x=>readTraining.add(String(x)));render()}}catch(_){}
 load(true).catch(e=>{console.warn('Synchronisation des notifications différée :',e.message);if(!announcements.length&&!training.length)$('notificationList').innerHTML='<div class="item" role="alert"><strong>Impossible de synchroniser les rubriques.</strong><div class="item-body">'+esc(e.message||'Vérifiez votre connexion Internet puis réessayez.')+'</div><button type="button" class="primary" id="retryNotifications">Réessayer</button></div>';$('retryNotifications')?.addEventListener('click',()=>load().catch(console.warn))});
 let refreshTimer=null;
 const refreshQuietly=()=>{clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>load(true).catch(e=>console.warn('Actualisation notifications',e)),400)};
 client.channel('ib-notification-center-rebuild-'+user.id)
  .on('postgres_changes',{event:'*',schema:'public',table:'announcements'},refreshQuietly)
  .on('postgres_changes',{event:'*',schema:'public',table:'training_resources'},refreshQuietly)
  .on('postgres_changes',{event:'*',schema:'public',table:'announcement_reads',filter:'user_id=eq.'+user.id},refreshQuietly)
  .on('postgres_changes',{event:'*',schema:'public',table:'training_resource_reads',filter:'user_id=eq.'+user.id},refreshQuietly)
  .on('postgres_changes',{event:'*',schema:'public',table:'registration_requests'},refreshQuietly)
  .on('postgres_changes',{event:'*',schema:'public',table:'admin_certification_reads',filter:'user_id=eq.'+user.id},refreshQuietly)
  .subscribe(status=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')console.warn('Canal temps réel des notifications interrompu:',status)});
 const refresh=()=>{if(navigator.onLine!==false&&!document.hidden)setTimeout(()=>load(true).catch(e=>console.warn('Actualisation différée',e)),250)};
 window.addEventListener('online',refresh);window.addEventListener('focus',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
}
document.addEventListener('inspecteurbot:authenticated',e=>init(e.detail));
function existing(){if(window.inspecteurBotAuthClient&&window.inspecteurBotAuthUser&&window.inspecteurBotAuthProfile)init({client:window.inspecteurBotAuthClient,user:window.inspecteurBotAuthUser,profile:window.inspecteurBotAuthProfile})}
existing();[250,750,1500,3000,5000,8000].forEach(delay=>setTimeout(existing,delay));
})();
</script></body></html>
