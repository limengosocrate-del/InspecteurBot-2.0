<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gestion des Infractions</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- InspecteurBot : authentification obligatoire Supabase -->

html:not(.inspecteur-auth-ready) body>*:not(#ib-auth-gate):not(#ib-startup-splash){visibility:hidden!important}
html:not(.inspecteur-auth-ready) body::before{content:"InspecteurBot";position:fixed;inset:0;z-index:2147482998;display:grid;place-items:center;padding:0 20px 74px;background:radial-gradient(circle at 50% 35%,#123f70 0%,#071b34 58%,#031126 100%);color:#fff;font:800 clamp(30px,7vw,44px) Arial,sans-serif;letter-spacing:.2px;visibility:visible!important}
html:not(.inspecteur-auth-ready) body::after{content:"";position:fixed;left:calc(50% - 16px);top:calc(50% + 16px);z-index:2147482998;width:28px;height:28px;border:3px solid #ffffff40;border-top-color:#ffd700;border-radius:50%;animation:ib-first-paint-spin .8s linear infinite;visibility:visible!important}
@keyframes ib-first-paint-spin{to{transform:rotate(360deg)}}

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin>
<script src="auth-gate.js?v=20261112-passkey-v1" defer></script>
<style id="inspecteurbot-touch-scroll">html,body{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important;touch-action:pan-y!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior-y:auto!important;scroll-behavior:auto!important}body{position:relative!important;min-height:100vh!important}@media(max-width:760px){body{min-height:100dvh!important}}</style>
</head>

<body>

<div class="main-content">

<section class="dashboard-section">

<h2>
<i class="fa-solid fa-triangle-exclamation"></i>
GESTION DES INFRACTIONS
</h2>

<div class="chart-box">

<h3>Nouvelle Infraction</h3>

<form id="formInfraction">

<input
type="text"
id="entreprise"
placeholder="Nom de l'entreprise"
required>

<select id="infraction" required>

<option value="">
Choisir le type d'infraction
</option>

<option>
Travail dissimulé
</option>

<option>
Non-respect du SMIG
</option>

<option>
Absence de contrat de travail
</option>

<option>
Non-déclaration des travailleurs
</option>

<option>
Non-paiement des salaires
</option>

<option>
Non-respect des congés
</option>

<option>
Violation des règles de sécurité
</option>

<option>
Obstruction à l'inspection
</option>

<option>
Autre infraction
</option>

</select>

<input
type="text"
id="sanction"
placeholder="Sanction ou mesure prise"
required>

<button type="submit">
<i class="fa-solid fa-floppy-disk"></i>
Enregistrer l'infraction
</button>

</form>

</div>

<div class="inspection-list">

<h3>
<i class="fa-solid fa-list"></i>
Liste des Infractions
</h3>

<table>

<thead>

<tr>
<th>N°</th>
<th>Entreprise</th>
<th>Infraction</th>
<th>Sanction</th>
<th>Action</th>
</tr>

</thead>

<tbody id="listeInfractions">

</tbody>

</table>

</div>

</section>

</div>

<script>

let infractions =
JSON.parse(
localStorage.getItem("infractions")
) || [];

function afficherInfractions(){

let html = "";

infractions.forEach((i,index)=>{

html += `
<tr>

<td>${index + 1}</td>

<td>${i.entreprise}</td>

<td>${i.infraction}</td>

<td>${i.sanction}</td>

<td>

<button
onclick="supprimerInfraction(${index})">

<i class="fa-solid fa-trash"></i>
Supprimer

</button>

</td>

</tr>
`;

});

document.getElementById(
"listeInfractions"
).innerHTML = html;

}

document.getElementById(
"formInfraction"
).addEventListener(
"submit",
function(e){

e.preventDefault();

infractions.push({

entreprise:
document.getElementById(
"entreprise"
).value,

infraction:
document.getElementById(
"infraction"
).value,

sanction:
document.getElementById(
"sanction"
).value

});

localStorage.setItem(
"infractions",
JSON.stringify(infractions)
);

this.reset();

afficherInfractions();

});

function supprimerInfraction(index){

if(confirm(
"Supprimer cette infraction ?"
)){

infractions.splice(index,1);

localStorage.setItem(
"infractions",
JSON.stringify(infractions)
);

afficherInfractions();

}

}

afficherInfractions();

</script>

</body>
</html>
