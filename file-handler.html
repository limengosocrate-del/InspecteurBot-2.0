<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#041c5c"><title>Ouvrir un fichier — InspecteurBot</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;background:linear-gradient(145deg,#03143b,#073b78);font-family:Arial,sans-serif;color:#fff}main{width:min(100%,600px);padding:24px;border:1px solid #ffffff2b;border-radius:20px;background:#ffffff0d}h1{margin-top:0}p{color:#dce8ff;line-height:1.5}#file{padding:13px;border-radius:10px;background:#ffffff12;width:100%}#preview{display:block;width:100%;max-height:65vh;min-height:120px;margin-top:18px;border:0;border-radius:10px;background:#fff;color:#17233a}button,a{display:inline-block;margin:12px 8px 0 0;padding:12px 16px;border:0;border-radius:10px;background:#ffd700;color:#071b45;font-weight:700;text-decoration:none;cursor:pointer}a{background:#ffffff20;color:#fff}#status{color:#ffe58a;font-size:13px}</style></head><body><main><h1>Fichier reçu dans InspecteurBot</h1><p>Le fichier reste sur votre appareil. Les fichiers PDF, images et textes peuvent être prévisualisés ici. Les documents Word et Excel peuvent être téléchargés ou ouverts avec une application compatible.</p><p id="filename">En attente du fichier…</p><div id="preview"></div><p id="status" aria-live="polite"></p><a href="./index.html">Retour à InspecteurBot</a></main><script>
(()=>{const name=document.getElementById('filename'),preview=document.getElementById('preview'),status=document.getElementById('status');let currentUrl='';function show(file){if(!file)return;name.textContent=file.name+' · '+Math.round(file.size/1024)+' Ko';if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(file);preview.replaceChildren();if(file.type==='application/pdf'){const frame=document.createElement('iframe');frame.src=currentUrl;frame.title='Aperçu PDF';frame.style.cssText='width:100%;height:65vh;border:0';preview.append(frame)}else if(file.type.startsWith('image/')){const img=document.createElement('img');img.src=currentUrl;img.alt=file.name;img.style.cssText='max-width:100%;max-height:65vh;display:block;margin:auto';preview.append(img)}else if(file.type.startsWith('text/')||/\.csv$/i.test(file.name)){const pre=document.createElement('pre');pre.style.cssText='white-space:pre-wrap;overflow:auto;max-height:65vh;padding:12px;color:#17233a';file.text().then(t=>pre.textContent=t.slice(0,200000));preview.append(pre)}else{const link=document.createElement('a');link.href=currentUrl;link.download=file.name;link.textContent='Télécharger le fichier';preview.append(link);status.textContent='Aperçu direct non disponible pour ce format. Utilisez le bouton de téléchargement.'}}if('launchQueue'in window){launchQueue.setConsumer(params=>{if(params.files&&params.files.length)params.files[0].getFile().then(show).catch(()=>status.textContent='Impossible de lire ce fichier.')})}else{status.textContent='Ouverture directe non prise en charge par ce navigateur. Utilisez le sélecteur de fichier.';const input=document.createElement('input');input.type='file';input.accept='.pdf,.png,.jpg,.jpeg,.webp,.txt,.csv,.docx,.xlsx';input.style.cssText='width:100%;margin:12px 0';input.addEventListener('change',()=>show(input.files[0]));preview.before(input)}window.addEventListener('beforeunload',()=>{if(currentUrl)URL.revokeObjectURL(currentUrl)})})();
</script></body></html>
