<html lang="fr">
<head>

<title>Messages — InspecteurBot</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{color-scheme:dark;--bg:#202124;--panel:#28292d;--panel2:#303136;--line:#3b3c42;--text:#f5f6f8;--muted:#aeb2bb;--blue:#0866ff;--green:#31c45b;--red:#e52d49}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}
.topnav{height:66px;display:flex;align-items:center;justify-content:space-around;border-bottom:1px solid var(--line);position:sticky;top:0;background:#202124;z-index:5}
.navbtn{position:relative;color:#f6f7f9;text-decoration:none;background:none;border:0;font-size:27px;padding:8px 16px}.navbtn.active{color:#1877f2}.bubble{position:absolute;top:-1px;right:4px;background:var(--red);color:white;border-radius:20px;min-width:21px;height:21px;padding:0 5px;font-size:12px;font-weight:800;display:grid;place-items:center}
.notice{display:none;padding:10px 16px;background:#34353a;color:#d9dce3;font-size:13px}.notice.show{display:block}
.wrap{max-width:850px;margin:auto;min-height:calc(100dvh - 66px)}
.head{display:flex;align-items:center;gap:14px;padding:17px 16px 12px}.back{color:white;text-decoration:none;font-size:23px}.head h1{font-size:29px;margin:0;font-weight:750;flex:1}.search-toggle{background:none;border:0;color:#eee;font-size:23px}
.searchbox{padding:0 16px 12px;display:none}.searchbox.show{display:block}.searchbox input{width:100%;background:#393a40;border:1px solid #4a4b52;color:white;border-radius:25px;padding:13px 16px;outline:none}
.section-label{padding:8px 16px;color:#bfc3cc;font-size:13px;font-weight:700}
.stories{display:flex;gap:15px;overflow-x:auto;padding:4px 15px 15px;scrollbar-width:none;min-height:116px;align-items:flex-start}.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 82px;text-align:center;border:0;background:none;color:white;padding:0;min-width:76px}.avatar-wrap{width:72px;height:72px;flex:0 0 72px;margin:0 auto 7px;position:relative;overflow:visible}.avatar{display:block;width:72px;height:72px;aspect-ratio:1/1;box-sizing:border-box;border-radius:50%;object-fit:cover;background:#45464d;border:2px solid #777}.story.online .avatar{border:3px solid #1684ff;padding:2px}.dot{position:absolute;width:15px;height:15px;border-radius:50%;background:var(--green);border:2px solid var(--bg);right:0;bottom:1px}.story-name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.online-empty{color:var(--muted);font-size:13px;padding:8px 16px 15px}
.inbox{padding:0 10px 90px}.person{width:100%;display:flex;align-items:center;gap:13px;text-align:left;background:none;border:0;color:var(--text);padding:11px 8px;border-radius:13px}.person:active,.person:hover{background:#303136}.person .avatar-wrap{width:58px;height:58px;flex:0 0 58px;margin:0}.person .avatar{border:0}.person-info{min-width:0;flex:1}.person-name{font-size:16px;font-weight:750;display:flex;align-items:center;gap:7px}.preview{font-size:13px;color:#c5c8cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.unread{background:var(--red);color:white;border-radius:50%;min-width:20px;height:20px;display:inline-grid;place-items:center;font-size:11px;font-weight:800;padding:0 5px}.empty{padding:35px 20px;text-align:center;color:var(--muted)}
.fab{position:fixed;right:max(20px,calc((100vw - 850px)/2 + 22px));bottom:26px;width:66px;height:66px;border:0;border-radius:50%;background:var(--blue);color:white;font-size:27px;box-shadow:0 5px 18px #0006}
.chat{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column}.chat.open{display:flex}.chathead{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line);background:#25262a}.chathead .avatar-wrap{width:43px;height:43px;flex:0 0 43px;margin:0}.chathead .avatar{border:0}.chatidentity{min-width:0;flex:1}.chatname{font-weight:750}.chatstatus{font-size:12px;color:var(--muted)}.chatbody{flex:1;overflow:auto;padding:16px 13px 22px;display:flex;flex-direction:column;gap:8px}.dayline{text-align:center;color:#9da2ad;font-size:11px;margin:9px}.bubblemsg{max-width:min(78%,520px);padding:10px 13px;border-radius:18px;background:#383a40;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.4}.bubblemsg.mine{background:#0866ff;align-self:flex-end}.msgmeta{font-size:10px;color:#d8dce5;text-align:right;margin-top:4px}.read-receipt{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-size:13px;line-height:1;font-weight:800;letter-spacing:-1.5px;color:#d8dce5;white-space:nowrap}.read-receipt.is-read{color:#53c7ff}.read-receipt .read-label{font-size:10px;font-weight:600;letter-spacing:0;color:#53c7ff}.read-receipt .read-checks{font-size:13px;font-weight:800;letter-spacing:-1.5px;color:inherit}.composer{display:flex;gap:9px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#25262a}.composer textarea{flex:1;resize:none;max-height:110px;min-height:43px;border:0;border-radius:22px;background:#3a3b41;color:white;padding:11px 15px;outline:none}.send{width:45px;height:45px;border:0;border-radius:50%;background:var(--blue);color:white}.send:disabled{opacity:.45}
.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#393a40;color:white;padding:10px 15px;border-radius:20px;z-index:30;display:none;max-width:90%;font-size:13px}.toast.show{display:block}
@media(min-width:700px){.chat{inset:5vh max(calc((100vw - 650px)/2),20px);border:1px solid #4b4d54;border-radius:18px;overflow:hidden}.fab{bottom:35px}}

/* Fenêtre privée plein écran : aucune liste de contacts derrière la discussion */
body.conversation-open{overflow:hidden!important}
body.conversation-open .topnav,
body.conversation-open .wrap,
body.conversation-open .fab{display:none!important}
.chat{position:fixed!important;inset:0!important;width:100%!important;height:100vh!important;height:100dvh!important;min-height:0!important;max-height:100dvh!important;overflow:hidden!important;overscroll-behavior:contain;z-index:100!important}
.chatbody{position:relative;isolation:isolate;flex:1 1 0!important;min-height:0!important;overflow-x:hidden!important;overflow-y:auto!important;background-color:#17191f!important;background-image:url('./assets/wallpaper-positano.jpg')!important;background-size:100% auto!important;background-position:center top!important;background-repeat:no-repeat!important;background-attachment:scroll!important;padding:16px 13px 22px;overscroll-behavior:contain!important}
.bubblemsg{max-width:min(84%,560px)!important;padding:12px 15px!important;border-radius:18px!important;font-size:16px!important;line-height:1.5!important;letter-spacing:0!important;overflow-wrap:anywhere;word-break:break-word}
.bubblemsg.mine{background:#0866ff;color:#fff}
.msgmeta{font-size:11px!important;line-height:1.3!important;margin-top:5px!important}
.composer{position:relative;z-index:3;display:flex!important;flex:0 0 auto!important;flex-direction:row!important;align-items:flex-end!important;gap:8px!important;width:100%!important;min-width:0!important;max-width:100%!important;min-height:66px;padding:9px 12px calc(10px + env(safe-area-inset-bottom))!important;overflow:visible!important;background:#25262a!important}
.composer textarea{display:block!important;box-sizing:border-box!important;flex:1 1 0!important;width:0!important;min-width:0!important;max-width:100%!important;min-height:46px!important;max-height:112px!important;margin:0!important;padding:12px 15px!important;font:16px/21px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif!important;resize:none!important;overflow-y:auto!important;overflow-wrap:anywhere!important;touch-action:pan-y}
.composer .send{display:grid!important;visibility:visible!important;opacity:1!important;place-items:center!important;flex:0 0 48px!important;width:48px!important;min-width:48px!important;max-width:48px!important;height:48px!important;min-height:48px!important;margin:0!important;padding:0!important;border:0!important;border-radius:50%!important;background:#0866ff!important;color:#fff!important;font-size:19px!important;line-height:1!important;align-self:flex-end!important}
.composer .send:disabled{opacity:.55!important}
@media(max-width:420px){.chatbody{padding:14px 11px 18px}.bubblemsg{max-width:86%!important;font-size:16px!important}.composer{gap:7px!important;padding-left:9px!important;padding-right:9px!important}}

.avatar-open{border:0;background:none;padding:0;cursor:zoom-in;border-radius:50%;display:block}
#profilePhotoViewer{position:fixed;inset:0;z-index:250;background:#000e;display:none;align-items:center;justify-content:center;padding:24px}
#profilePhotoViewer.show{display:flex}
#profilePhotoViewer img{max-width:min(92vw,560px);max-height:82dvh;object-fit:contain;border-radius:18px;box-shadow:0 15px 50px #0009}
#profilePhotoViewer button{position:absolute;top:18px;right:18px;width:44px;height:44px;border:0;border-radius:50%;background:#333;color:#fff;font-size:22px}

.group-toolbar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px}
.group-create-btn{border:0;border-radius:20px;background:#0866ff;color:white;padding:8px 13px;font-weight:700}
.group-list{display:flex;gap:9px;overflow-x:auto;padding:5px 15px 12px}
.group-chip{display:flex;align-items:center;gap:8px;flex:0 0 auto;background:#303136;border:1px solid #44464e;color:white;border-radius:14px;padding:7px 11px;max-width:210px}
.group-chip img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.group-chip strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
#groupCreateModal{position:fixed;inset:0;z-index:220;background:#000b;display:none;align-items:center;justify-content:center;padding:16px}
#groupCreateModal.show{display:flex}
.group-dialog{width:min(540px,100%);max-height:88dvh;overflow:auto;background:#282a30;border:1px solid #484b54;border-radius:20px;padding:18px}
.group-dialog h2{margin:0 0 14px;font-size:21px}
.group-dialog label{display:block;font-size:13px;color:#d5d8df;margin-top:10px}
.group-dialog input[type=text],.group-dialog input[type=search]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #555965;background:#1e2025;color:white;margin:7px 0 12px}
.group-results{display:grid;gap:7px;max-height:32vh;overflow:auto}
.group-result{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:#33353b}
.group-result img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.group-result span{flex:1;min-width:0}
.group-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.group-actions button{border:0;border-radius:12px;padding:11px 15px;font-weight:700}
.group-cancel{background:#44464d;color:white}.group-submit{background:#0866ff;color:white}
</style>
</head>

<nav class="topnav" aria-label="Navigation messagerie">
<a class="navbtn" href="index.html" aria-label="Accueil"><i class="fa-solid fa-house"></i></a>
<button class="navbtn" id="peopleNav" aria-label="Agents en ligne"><i class="fa-solid fa-user-group"></i><span class="bubble" id="onlineCount">0</span></button>
<button class="navbtn active" aria-label="Messages"><i class="fa-brands fa-facebook-messenger"></i><span class="bubble" id="unreadTop" hidden>0</span></button>
<button class="navbtn" id="refreshNav" aria-label="Actualiser"><i class="fa-solid fa-bell"></i></button>
</nav>
<div class="notice" id="notice"></div>
<main class="wrap">
<div class="section-label">Agents en ligne</div>
<div class="stories" id="onlineStories"><div class="online-empty">Chargement des agents…</div></div>
<div class="group-toolbar"><span class="section-label">Groupes</span><button class="group-create-btn" id="createGroupButton" type="button"><i class="fa-solid fa-users"></i> Créer un groupe</button></div><div class="group-list" id="groupList"><span class="online-empty">Chargement des groupes…</span></div>
<header class="head"><a class="back" href="index.html" aria-label="Retour"><i class="fa-solid fa-chevron-left"></i></a><h1>Messages</h1><button class="search-toggle" id="searchToggle" aria-label="Rechercher un agent"><i class="fa-solid fa-magnifying-glass"></i></button></header>
<div class="searchbox" id="searchBox"><input id="searchInput" type="search" placeholder="Rechercher un agent par son nom…" autocomplete="off"></div>
<div class="section-label">Conversations</div>
<section class="inbox" id="inbox"><div class="empty">Chargement de vos conversations…</div></section>
</main>
<button class="fab" id="newMessage" aria-label="Nouveau message"><i class="fa-solid fa-plus"></i></button>
<section class="chat" id="chat" aria-label="Conversation">
<header class="chathead"><button class="back" id="closeChat" aria-label="Fermer"><i class="fa-solid fa-chevron-left"></i></button><button class="avatar-open" id="chatAvatarButton" type="button" aria-label="Afficher la photo de profil"><span class="avatar-wrap"><img class="avatar" id="chatAvatar" alt=""><span class="dot" id="chatDot" hidden></span></span></button><div class="chatidentity"><div class="chatname" id="chatName">Agent</div><div class="chatstatus" id="chatStatus"> </div></div></header>
<div class="chatbody" id="chatBody"><div class="empty">Ouvrez une conversation</div></div>
<form class="composer" id="composer"><textarea id="messageInput" rows="1" maxlength="10000" placeholder="Écrire un message…" required></textarea><button class="send" id="sendButton" type="submit" aria-label="Envoyer"><i class="fa-solid fa-paper-plane"></i></button></form>
</section>
<div id="profilePhotoViewer" role="dialog" aria-modal="true" aria-label="Photo de profil"><button type="button" id="closeProfilePhoto" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button><img id="profilePhotoLarge" alt="Photo de profil"></div><div id="groupCreateModal" role="dialog" aria-modal="true" aria-labelledby="groupModalTitle">
<form class="group-dialog" id="groupCreateForm">
<h2 id="groupModalTitle">Créer un groupe</h2>
<label for="groupNameInput">Nom du groupe</label><input id="groupNameInput" type="text" maxlength="80" minlength="2" placeholder="Ex. Équipe de contrôle Kinshasa" required>
<label for="groupAvatarInput">Photo du groupe</label><input id="groupAvatarInput" type="file" accept="image/jpeg,image/png,image/webp">
<label for="groupMemberSearch">Ajouter des membres</label><input id="groupMemberSearch" type="search" placeholder="Rechercher par nom…" autocomplete="off">
<div class="group-results" id="groupMemberResults"><div class="online-empty">Saisissez au moins 2 caractères pour rechercher.</div></div>
<div class="group-actions"><button class="group-cancel" id="cancelGroupCreate" type="button">Annuler</button><button class="group-submit" id="submitGroupCreate" type="submit">Créer le groupe</button></div>
</form></div><div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{'use strict';
const SUPABASE_URL='https://icymfsvbuandgvrhwmaw.supabase.co';
const SUPABASE_KEY='sb_publishable_ehMQbO5ac2-9RSdiOmxKJw_yPw2ES7z';
const $=id=>document.getElementById(id);
function withTimeout(promise,ms,label){
 let timer;
 return Promise.race([Promise.resolve(promise),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('Délai dépassé : '+label)),ms)})]).finally(()=>clearTimeout(timer));
}
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let me=null,myProfile=null,people=[],active=null,conversationChannel=null,messageChannel=null,presenceChannel=null,searchTimer=null,heartbeatTimer=null,refreshTimer=null,groupSearchTimer=null,groupSearchResults=[],selectedGroupMembers=new Map();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avatar=p=>p?.avatar_url||'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#45464d"/><circle cx="50" cy="37" r="19" fill="#aeb2bb"/><path d="M15 95c2-24 16-36 35-36s33 12 35 36" fill="#aeb2bb"/></svg>');
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
function initials(s){return s||'Agent'}
function online(p){return !!p?.is_online}
function setNotice(s){$('notice').textContent=s;$('notice').classList.toggle('show',!!s)}
async function init(){
 let authResult;
 try{authResult=await withTimeout(client.auth.getSession(),12000,'authentification')}
 catch(error){setNotice('Connexion trop lente. Vérifiez votre réseau puis actualisez la messagerie.');$('onlineStories').innerHTML='<div class="online-empty">Connexion au service indisponible. Réessayez.</div>';$('groupList').innerHTML='<span class="online-empty">Groupes indisponibles pour le moment.</span>';$('inbox').innerHTML='<div class="empty">Conversations indisponibles. Vérifiez votre connexion.</div>';return}
 const {data:{session},error}=authResult;
 if(error||!session){location.replace('index.html?from=messages');return}
 me=session.user;
 let profileResult;
 try{profileResult=await withTimeout(client.from('profiles').select('id,display_name,avatar_url,is_active').eq('id',me.id).maybeSingle(),12000,'profil')}
 catch(error){setNotice('Chargement du profil trop lent. Vérifiez votre connexion puis actualisez.');$('onlineStories').innerHTML='<div class="online-empty">Profil indisponible. Réessayez après vérification du réseau.</div>';$('groupList').innerHTML='<span class="online-empty">Groupes indisponibles pour le moment.</span>';$('inbox').innerHTML='<div class="empty">Conversations indisponibles. Vérifiez votre connexion.</div>';return}
 const {data:profile,error:pe}=profileResult;
 if(pe||!profile||!profile.is_active){setNotice('Accès réservé aux agents autorisés de l’Inspection Générale du Travail.');return}
 myProfile=profile;
 // Ne pas bloquer l'ouverture de l'écran sur les requêtes de listes.
 // Les trois panneaux se chargent indépendamment et en parallèle.
 void refreshAll();
 if(new URLSearchParams(location.search).get('view')==='presence'){
  setTimeout(()=>{$('onlineStories').scrollIntoView({behavior:'smooth',block:'start'});$('peopleNav').classList.add('active')},250);
 }
 void heartbeat();
 heartbeatTimer=setInterval(()=>{if(document.visibilityState==='visible')void heartbeat()},60000);
 refreshTimer=setInterval(()=>{if(document.visibilityState==='visible')void refreshAll()},120000);
 messageChannel=client.channel('ib-messages-'+me.id)
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'recipient_id=eq.'+me.id},payload=>onIncoming(payload.new))
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'sender_id=eq.'+me.id},()=>refreshInbox())
 .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:'sender_id=eq.'+me.id},payload=>{updateReadReceipt(payload.new);refreshInbox()})
 .subscribe(status=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')setNotice('Connexion temps réel interrompue. Reconnexion automatique…');else if(status==='SUBSCRIBED')setNotice('')});
 presenceChannel=client.channel('ib-presence-'+me.id).on('postgres_changes',{event:'*',schema:'public',table:'user_presence'},payload=>{const changedId=payload.new?.user_id||payload.old?.user_id;if(changedId&&changedId!==me.id)refreshPresenceAndReceipts()}).subscribe();
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){void heartbeat();void refreshAll()}});
 window.addEventListener('pagehide',()=>{clearInterval(heartbeatTimer);clearInterval(refreshTimer);if(presenceChannel)client.removeChannel(presenceChannel)});
}
async function heartbeat(){
 if(!me||document.visibilityState==='hidden')return;
 const now=new Date().toISOString();
 const {error}=await client.from('user_presence').upsert({user_id:me.id,last_seen:now,updated_at:now},{onConflict:'user_id'});
 if(error)console.warn('Présence non actualisée',error);
}
async function loadPeople(term='',onlyOnline=false){
 const {data,error}=await withTimeout(client.rpc('get_agent_directory',{search_text:term,online_only:onlyOnline}),12000,'annuaire des agents');
 if(error)throw error;
 return (data||[]).filter(p=>p.id!==me.id);
}
let refreshAllRunning=false,refreshAllPending=false;
async function refreshAll(){
 if(!me)return;
 if(refreshAllRunning){refreshAllPending=true;return}
 refreshAllRunning=true;
 try{
  // Annuaire, conversations et groupes démarrent simultanément :
  // un service lent ne bloque plus les deux autres panneaux.
  const [directoryResult]=await Promise.all([
   loadPeople().then(value=>({status:'fulfilled',value})).catch(error=>({status:'rejected',reason:error})),
   refreshInbox().catch(error=>{console.warn('Conversations:',error)}),
   refreshGroups().catch(error=>{console.warn('Groupes:',error)})
  ]);
  if(directoryResult.status==='fulfilled'){people=directoryResult.value;renderStories();await refreshInbox()}
  else{$('onlineStories').innerHTML='<div class="online-empty">Agents momentanément indisponibles. Réessayez.</div>'}
  if(active){const p=people.find(x=>x.id===active.id);if(p)updateChatHeader(p)}
 }finally{
  refreshAllRunning=false;
  if(refreshAllPending){refreshAllPending=false;void refreshAll()}
 }
}

async function refreshGroups(){
 let membershipResult;
 try{membershipResult=await withTimeout(client.from('chat_group_members').select('group_id').eq('user_id',me.id),12000,'groupes')}
 catch(error){$('groupList').innerHTML='<span class="online-empty">Le chargement des groupes prend trop de temps. Réessayez.</span>';console.warn(error);return}
 const {data:membership,error}=membershipResult;
 if(error){console.warn('Groupes indisponibles',error);$('groupList').innerHTML='<span class="online-empty">Groupes momentanément indisponibles.</span>';return}
 const ids=[...new Set((membership||[]).map(x=>x.group_id))];
 if(!ids.length){$('groupList').innerHTML='<span class="online-empty">Aucun groupe créé pour le moment.</span>';return}
 let groupsResult;try{groupsResult=await withTimeout(client.from('chat_groups').select('id,name,avatar_url').in('id',ids).order('created_at',{ascending:false}),12000,'liste des groupes')}catch(error){$('groupList').innerHTML='<span class="online-empty">Impossible de charger les groupes pour le moment.</span>';console.warn(error);return}const {data:groups,error:ge}=groupsResult;
 if(ge){console.warn(ge);return}
 $('groupList').innerHTML=(groups||[]).map(g=>'<div class="group-chip"><img src="'+esc(g.avatar_url||avatar(null))+'" alt=""><strong>'+esc(g.name)+'</strong></div>').join('');
}
\nfunction renderStories(){
 const list=people.filter(online);
 $('onlineCount').textContent=list.length>99?'99+':String(list.length);
 $('onlineStories').innerHTML=list.length?list.map(p=>'<button class="story online" data-person="'+esc(p.id)+'"><span class="avatar-wrap"><img class="avatar" loading="lazy" src="'+esc(avatar(p))+'" alt=""><i class="dot"></i></span><span class="story-name">'+esc(initials(p.display_name))+'</span></button>').join(''):'<div class="online-empty">Aucun agent en ligne pour le moment.</div>';
}
async function refreshInbox(){
 if(!me)return;
 let result;
 try{result=await withTimeout(client.from('messages').select('id,sender_id,recipient_id,content,read_at,created_at').or('sender_id.eq.'+me.id+',recipient_id.eq.'+me.id).order('created_at',{ascending:false}).limit(100),12000,'conversations')}
 catch(error){$('inbox').innerHTML='<div class="empty">Le chargement des conversations prend trop de temps. Vérifiez votre connexion puis réessayez.</div>';console.warn(error);return}
 const {data,error}=result;
 if(error){$('inbox').innerHTML='<div class="empty">Messagerie momentanément indisponible.</div>';console.error(error);return}
 const latest=new Map(),unread=new Map();
 for(const m of data||[]){const other=m.sender_id===me.id?m.recipient_id:m.sender_id;if(!latest.has(other))latest.set(other,m);if(m.recipient_id===me.id&&!m.read_at)unread.set(other,(unread.get(other)||0)+1)}
 const ids=[...latest.keys()];
 const mapped=ids.map(id=>({person:people.find(p=>p.id===id)||{id,display_name:'Agent IGT',avatar_url:null,is_online:false},message:latest.get(id),unread:unread.get(id)||0})).sort((a,b)=>new Date(b.message.created_at)-new Date(a.message.created_at));
 const total=[...unread.values()].reduce((a,b)=>a+b,0);$('unreadTop').hidden=!total;$('unreadTop').textContent=total>99?'99+':String(total);
 $('inbox').innerHTML=mapped.length?mapped.map(x=>'<button class="person" data-person="'+esc(x.person.id)+'"><span class="avatar-wrap"><img class="avatar" loading="lazy" src="'+esc(avatar(x.person))+'" alt="">'+(online(x.person)?'<i class="dot"></i>':'')+'</span><span class="person-info"><span class="person-name">'+esc(x.person.display_name)+(x.unread?'<span class="unread">'+x.unread+'</span>':'')+'</span><span class="preview">'+(x.message.sender_id===me.id?'Vous : ':'')+esc(x.message.content)+'</span></span></button>').join(''):'<div class="empty">Aucune conversation pour le moment.<br>Recherchez un collègue pour commencer à discuter.</div>';
}
function updateChatHeader(p){$('chatName').textContent=p.display_name||'Agent IGT';$('chatAvatar').src=avatar(p);$('chatAvatar').alt='Photo de profil de '+(p.display_name||'Agent IGT');$('chatDot').hidden=!online(p);$('chatStatus').textContent=online(p)?'En ligne':'Hors ligne'}
async function openChat(person){
 active=person;updateChatHeader(person);document.body.classList.add('conversation-open');$('chat').classList.add('open');$('messageInput').focus();
 await loadConversation();
 if(conversationChannel)client.removeChannel(conversationChannel);
 conversationChannel=client.channel('ib-chat-'+[me.id,person.id].sort().join('-'))
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'sender_id=eq.'+person.id},payload=>{if(payload.new.recipient_id===me.id)appendMessage(payload.new);})
 .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:'sender_id=eq.'+me.id},payload=>updateReadReceipt(payload.new))
 .subscribe();
}
async function loadConversation(){
 const personId=active.id;
 const columns='id,sender_id,recipient_id,content,read_at,created_at';
 const [sentResult,receivedResult]=await Promise.all([
  client.from('messages').select(columns).eq('sender_id',me.id).eq('recipient_id',personId).order('created_at',{ascending:true}).limit(300),
  client.from('messages').select(columns).eq('sender_id',personId).eq('recipient_id',me.id).order('created_at',{ascending:true}).limit(300)
 ]);
 if(sentResult.error||receivedResult.error){console.error(sentResult.error||receivedResult.error);$('chatBody').innerHTML='<div class="empty">Impossible de charger cette conversation.</div>';return}
 const data=[...(sentResult.data||[]),...(receivedResult.data||[])].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
 $('chatBody').innerHTML='';data.forEach(appendMessage);
 const unread=data.filter(m=>m.recipient_id===me.id&&!m.read_at);
 if(unread.length){await client.from('messages').update({read_at:new Date().toISOString()}).in('id',unread.map(m=>m.id));await refreshInbox()}
 scrollChat();
}
async function refreshPresenceAndReceipts(){
 people=await loadPeople();renderStories();
 if(active){const current=people.find(p=>p.id===active.id);if(current){active=current;updateChatHeader(current)}}
 refreshMessageReceipts();
}
function setReceiptState(receipt,recipientId,isRead){
 if(!receipt)return;
 receipt.dataset.recipient=recipientId;
 receipt.dataset.read=isRead?'true':'false';
 if(isRead){receipt.classList.add('is-read');receipt.innerHTML='<span class="read-label">Lu</span><span class="read-checks">✓✓</span>';receipt.setAttribute('aria-label','Lu');receipt.title='Lu';return;}
 receipt.classList.remove('is-read');
 const recipient=people.find(p=>p.id===recipientId);
 receipt.textContent=online(recipient)?'✓✓':'✓';
 receipt.setAttribute('aria-label',online(recipient)?'Envoyé, destinataire en ligne':'Envoyé, destinataire hors ligne');
 receipt.title=online(recipient)?'Destinataire en ligne':'Destinataire hors ligne';
}
function refreshMessageReceipts(){
 $('chatBody').querySelectorAll('.read-receipt').forEach(receipt=>setReceiptState(receipt,receipt.dataset.recipient,receipt.dataset.read==='true'));
}
function updateReadReceipt(m){
 if(!m||m.sender_id!==me.id||!m.read_at)return;
 const el=$('chatBody').querySelector('[data-msg="'+m.id+'"]');
 const receipt=el?.querySelector('.read-receipt');
 if(receipt)setReceiptState(receipt,m.recipient_id,true);
}
function appendMessage(m){
 if(!active||![m.sender_id,m.recipient_id].includes(active.id)||![m.sender_id,m.recipient_id].includes(me.id))return;
 if($('chatBody').querySelector('[data-msg="'+m.id+'"]')){updateReadReceipt(m);return}
 const el=document.createElement('div');el.className='bubblemsg'+(m.sender_id===me.id?' mine':'');el.dataset.msg=m.id;
 const text=document.createElement('div');text.textContent=m.content;
 const meta=document.createElement('div');meta.className='msgmeta';
 meta.append(document.createTextNode(new Date(m.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})));
 if(m.sender_id===me.id){
  const receipt=document.createElement('span');receipt.className='read-receipt';setReceiptState(receipt,m.recipient_id,!!m.read_at);meta.append(receipt);
 }
 el.append(text,meta);$('chatBody').append(el);scrollChat();
 if(m.recipient_id===me.id&&!m.read_at){
  client.from('messages').update({read_at:new Date().toISOString()}).eq('id',m.id).then(({error})=>{if(error)console.warn('Confirmation de lecture indisponible',error);else refreshInbox()});
 }
}
function scrollChat(){$('chatBody').scrollTop=$('chatBody').scrollHeight}
function onIncoming(m){if(active?.id===m.sender_id){appendMessage(m)}else toast('Nouveau message reçu');refreshInbox()}
async function sendMessage(e){
 e.preventDefault();if(!active||!me)return;
 const input=$('messageInput'),content=input.value.trim();if(!content)return;
 if(content.length>10000){toast('Message trop long (10 000 caractères maximum).');return}
 const recipientId=active.id;
 $('sendButton').disabled=true;
 try{
  const {data,error}=await client.from('messages').insert({sender_id:me.id,recipient_id:recipientId,content}).select('id,sender_id,recipient_id,content,read_at,created_at').single();
  if(error){
   console.error('Échec de l’envoi du message Supabase:',{code:error.code,message:error.message,details:error.details,hint:error.hint});
   toast(error.code==='42501'?'Envoi refusé par les autorisations. Reconnectez-vous puis réessayez.':'Message non envoyé. Vérifiez votre connexion et réessayez.');
   return;
  }
  input.value='';input.style.height='44px';appendMessage(data);await refreshInbox();
 }catch(error){
  console.error('Erreur réseau pendant l’envoi:',error);
  toast('Connexion interrompue : votre message n’a pas été envoyé.');
 }finally{$('sendButton').disabled=false}
}
async function search(term){
 if(!term.trim()){people=await loadPeople();renderStories();await refreshInbox();return}
 const results=await loadPeople(term,false);people=results;
 $('onlineStories').innerHTML=results.length?results.map(p=>'<button class="story '+(online(p)?'online':'')+'" data-person="'+esc(p.id)+'"><span class="avatar-wrap"><img class="avatar" loading="lazy" src="'+esc(avatar(p))+'" alt="">'+(online(p)?'<i class="dot"></i>':'')+'</span><span class="story-name">'+esc(p.display_name)+'</span></button>').join(''):'<div class="online-empty">Aucun agent trouvé.</div>';
}


$('createGroupButton').addEventListener('click',()=>{$('groupCreateModal').classList.add('show');$('groupNameInput').focus()});
$('cancelGroupCreate').addEventListener('click',()=>{$('groupCreateModal').classList.remove('show');selectedGroupMembers.clear()});
$('groupMemberSearch').addEventListener('input',e=>{
 clearTimeout(groupSearchTimer);const term=e.target.value.trim();
 groupSearchTimer=setTimeout(async()=>{
  if(term.length<2){$('groupMemberResults').innerHTML='<div class="online-empty">Saisissez au moins 2 caractères.</div>';return}
  groupSearchResults=await loadPeople(term,false);
  $('groupMemberResults').innerHTML=groupSearchResults.length?groupSearchResults.map(p=>'<label class="group-result"><img src="'+esc(avatar(p))+'" alt=""><span><strong>'+esc(p.display_name)+'</strong><small> · '+(online(p)?'En ligne':'Hors ligne')+'</small></span><input type="checkbox" data-group-user="'+esc(p.id)+'" '+(selectedGroupMembers.has(p.id)?'checked':'')+'></label>').join(''):'<div class="online-empty">Cette personne n’utilise pas InspecteurBot ou aucun résultat ne correspond.</div>';
 },250);
});
$('groupMemberResults').addEventListener('change',e=>{const id=e.target.dataset.groupUser;if(!id)return;const p=groupSearchResults.find(x=>x.id===id);if(!p)return;if(e.target.checked)selectedGroupMembers.set(id,p);else selectedGroupMembers.delete(id)});
$('groupCreateForm').addEventListener('submit',async e=>{
 e.preventDefault();const name=$('groupNameInput').value.trim();
 if(name.length<2){toast('Le nom du groupe doit contenir au moins 2 caractères.');return}
 if(!selectedGroupMembers.size){toast('Sélectionnez au moins un membre.');return}
 const submit=$('submitGroupCreate');submit.disabled=true;submit.textContent='Création…';
 try{
  let avatarUrl=null;const file=$('groupAvatarInput').files[0];
  if(file){
   if(file.size>5*1024*1024)throw new Error('La photo ne doit pas dépasser 5 Mo.');
   const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=me.id+'/'+crypto.randomUUID()+'.'+ext;
   const {error:upErr}=await client.storage.from('chat-group-avatars').upload(path,file,{upsert:false,contentType:file.type});if(upErr)throw upErr;
   avatarUrl=client.storage.from('chat-group-avatars').getPublicUrl(path).data.publicUrl;
  }
  const {data:g,error:ge}=await client.from('chat_groups').insert({name,avatar_url:avatarUrl,created_by:me.id}).select('id').single();if(ge)throw ge;
  const rows=[{group_id:g.id,user_id:me.id,added_by:me.id},...Array.from(selectedGroupMembers.keys()).map(id=>({group_id:g.id,user_id:id,added_by:me.id}))];
  const {error:meErr}=await client.from('chat_group_members').insert(rows);if(meErr)throw meErr;
  $('groupCreateModal').classList.remove('show');$('groupCreateForm').reset();selectedGroupMembers.clear();await refreshGroups();
  toast('Groupe créé. Les messages de groupe seront activés après le déploiement du chiffrement de bout en bout.');
 }catch(err){console.error('Création groupe',err);toast(err.message||'Impossible de créer le groupe.')}
 finally{submit.disabled=false;submit.textContent='Créer le groupe'}
});
