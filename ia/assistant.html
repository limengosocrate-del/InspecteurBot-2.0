<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant IA — InspecteurBot RDC</title>
<link rel="stylesheet" href="../fiche.css?v=41">
<link rel="stylesheet" href="../autres/decompte-final.css?v=1">
<style>
:root{color-scheme:light;--ib-bg:#f7f7f8;--ib-panel:#fff;--ib-text:#202123;--ib-muted:#6b7280;--ib-border:#e5e7eb;--ib-dark:#172033;--ib-accent:#0f766e}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.background,.particles{display:none!important}
body{display:flex;flex-direction:column;min-height:100dvh;background:var(--ib-bg);color:var(--ib-text);overflow:hidden}
.header{height:72px;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 clamp(16px,4vw,42px);background:#fff;border-bottom:1px solid var(--ib-border);box-shadow:0 1px 3px rgba(0,0,0,.03);z-index:5}
.header-left{display:flex;align-items:center;gap:13px;min-width:0}
.logo{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:13px;background:#eef5f4;overflow:hidden}
.logo img{width:34px;height:34px;object-fit:contain}
.header-text h1{margin:0;color:#202123;font-size:17px;line-height:1.25;font-weight:700;letter-spacing:-.3px}
.header-text h2{margin:3px 0 0;color:#59616d;font-size:12px;font-weight:500}
.header-text p{display:none}
.header-right{display:flex;align-items:center;gap:8px}
.btn-retour{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--ib-border);border-radius:10px;background:#fff;color:#374151;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
.btn-retour:hover{background:#f3f4f6}
.chat-container{width:min(100%,920px);flex:1;min-height:0;margin:0 auto;padding:14px clamp(14px,3vw,28px) 20px;display:flex}
.chat-box{width:100%;min-height:0;display:flex;flex-direction:column;gap:10px;background:transparent;border:0;border-radius:0;padding:0;backdrop-filter:none}
.chat-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 0}
.tool-btn{border:1px solid var(--ib-border);background:#fff;color:#4b5563;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s}
.tool-btn:hover{background:#f0f2f4;border-color:#cbd5e1}
.chat-messages{flex:1;min-height:180px;height:auto;overflow-y:auto;padding:22px 2px 28px;background:transparent;border:0;border-radius:0;margin:0;display:flex;flex-direction:column;gap:20px;scroll-behavior:smooth}
.msg{max-width:82%;padding:13px 17px;border-radius:18px;margin:0;line-height:1.7;font-size:15px;animation:fadeIn .2s ease;overflow-wrap:anywhere;white-space:pre-wrap}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;background:#e8e8eb;color:#242424;margin-left:auto;text-align:left;border-bottom-right-radius:5px}
.msg.bot{align-self:flex-start;max-width:100%;background:transparent;color:#262a30;border:0;padding:4px 2px;border-radius:0}
.msg-time{font-size:10px;color:#9298a1;margin-top:7px}
.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 2px}
.suggestions button{background:#fff;color:#46505d;border:1px solid #dfe3e8;padding:8px 12px;border-radius:18px;cursor:pointer;font-size:12px;transition:.15s}
.suggestions button:hover{background:#edf3f2;border-color:#b8d5d0;color:#155e56}
.chat-input{display:flex;gap:9px;align-items:center;padding:9px 10px 9px 13px;background:#fff;border:1px solid #d9dde3;border-radius:25px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.chat-input input{flex:1;min-width:0;padding:12px 5px;border:0;outline:none;background:transparent;color:#202123;font-size:15px}
.chat-input input::placeholder{color:#9298a1}
.chat-input button{flex:0 0 43px;width:43px;height:43px;border:0;border-radius:50%;background:#202123;color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center}
.chat-input button:hover{background:#3b414b}
.chat-input button:disabled{opacity:.5;cursor:wait}
#btnVoice{background:#eef0f2;color:#414852}
.listening{background:#dc3545!important;color:#fff!important;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.chat-container code{background:#eef0f2;padding:2px 5px;border-radius:4px}
@media(max-width:600px){
 .header{height:64px;min-height:64px;padding:0 13px}
 .logo{width:36px;height:36px;flex-basis:36px}
 .logo img{width:29px;height:29px}
 .header-text h1{font-size:15px}
 .header-text h2{font-size:10px}
 .btn-retour{padding:8px 10px;font-size:12px}
 .chat-container{padding:8px 12px 12px}
 .chat-actions{gap:6px}
 .tool-btn{padding:7px 9px;font-size:11px}
 .chat-messages{padding:15px 0 20px;gap:16px}
 .msg{max-width:91%;font-size:14px;padding:11px 14px}
 .msg.bot{max-width:100%}
 .suggestions{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
 .suggestions button{white-space:nowrap}
 .chat-input{gap:6px;padding:7px 8px 7px 11px}
 .chat-input input{font-size:14px}
 .chat-input button{width:39px;height:39px;flex-basis:39px}
}
</style>

<!-- InspecteurBot : authentification obligatoire Supabase -->
<style id="inspecteurbot-auth-lock">html:not(.inspecteur-auth-ready) body > *:not(#ib-auth-gate){visibility:hidden!important}</style>
<script src="../auth-gate.js?v=20261107-auth-smooth-12" defer></script>
</head>
<body>
<div class="background"></div>
<div class="particles"></div>

<header class="header">
  <div class="header-left">
    <div class="logo"><img src="../assets/images/logo-igt.png" alt="IGT"></div>
    <div class="header-text">
      <h1>InspecteurBot IA</h1>
      <h2>Assistant intelligent de l'Inspection Générale du Travail • RDC</h2>
      <p>Consultation professionnelle et assistance juridique</p>
    </div>
  </div>
  <div class="header-right"><a href="../index.html#assistant-intelligent" class="btn-retour">← Accueil</a></div>
</header>

<main class="chat-container">
  <div class="chat-box">
    <div class="chat-actions">
      <button class="tool-btn" id="btnNewChat">＋ Nouvelle conversation</button>
      <button class="tool-btn" id="btnExportChat">↓ Exporter</button>
      <button class="tool-btn" id="btnSpeakToggle">🔊 Lecture auto : OFF</button>
    </div>

    <div class="chat-messages" id="messages" aria-live="polite"></div>
    <div class="suggestions" id="suggestions"></div>

    <div class="chat-input">
      <button id="btnVoice" title="Reconnaissance vocale" aria-label="Reconnaissance vocale">🎙</button>
      <input type="text" id="input" placeholder="Écrivez votre message à InspecteurBot…" autocomplete="off" aria-label="Votre message">
      <button id="btnSend" title="Envoyer" aria-label="Envoyer">↑</button>
    </div>
  </div>
</main>

<script src="../js/smig-data.js?v=1"></script>
<script src="../js/ai-knowledge.js?v=1"></script>
<script src="../js/ai-nlp.js?v=1"></script>
<script src="../js/ai-core.js?v=1"></script>
<script src="../js/assistant.js?v=1"></script>
<script>
let speakAuto = false;

function render() {
  const box = document.getElementById("messages");
  box.innerHTML = "";
  const conv = ASSISTANT.loadConversation();
  if (!conv.length) {
    ASSISTANT.addMessage("bot", "Bonjour 👋 Je suis InspecteurBot IA. Je peux répondre à vos questions, consulter les informations professionnelles de l’annuaire IGT et vous assister sur le droit du travail, les contrôles, les fiches et les projets de documents. Posez votre question en langage naturel.");
  }
  ASSISTANT.conversation.forEach(m => addBubble(m.role, m.text, m.ts));
  box.scrollTop = box.scrollHeight;
}

function addBubble(role, text, ts) {
  const box = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg " + role;
  const safeText = String(text || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const html = safeText.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                   .replace(/`(.+?)`/g, "<code>$1</code>")
  div.innerHTML = html + `<div class="msg-time">${ts ? new Date(ts).toLocaleTimeString("fr-FR") : ""}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}
async function send() {
  const input = document.getElementById("input");
  const sendButton = document.getElementById("btnSend");
  const q = input.value.trim();
  if (!q || sendButton.disabled) return;

  const client = window.inspecteurBotAuthClient;
  if (!client) {
    addBubble("bot", "Votre session sécurisée n'est pas prête. Rechargez la page ou reconnectez-vous.", new Date().toISOString());
    return;
  }

  const previous = ASSISTANT.conversation.slice(-10).map(m => ({
    role: m.role === "bot" ? "assistant" : "user",
    content: String(m.text || "").slice(0, 2500)
  }));

  ASSISTANT.addMessage("user", q);
  addBubble("user", q, new Date().toISOString());
  input.value = "";
  input.disabled = true;
  sendButton.disabled = true;
  sendButton.textContent = "…";
  const pending = addBubble("bot", "🧠 InspecteurBot analyse votre question et consulte les données IGT…", new Date().toISOString());

  try {
    const { data: sessionData, error: sessionError } = await client.auth.getSession();
    if (sessionError || !sessionData.session) throw new Error("Session expirée. Reconnectez-vous à InspecteurBot.");

    const { data, error } = await client.functions.invoke("inspecteurbot-ai", {
      body: { question: q, history: previous }
    });

    if (error || !data || !data.answer) {
      let message = data && data.error ? data.error : "Le service IA n'a pas répondu. Réessayez.";
      if (error && error.context && typeof error.context.clone === "function") {
        try {
          const details = await error.context.clone().json();
          if (details && details.error) message = details.error;
        } catch (_) {}
      }
      throw new Error(message);
    }

    pending.remove();
    ASSISTANT.addMessage("bot", data.answer);
    addBubble("bot", data.answer, new Date().toISOString());
    if (speakAuto) ASSISTANT.speak(data.answer);
  } catch (err) {
    pending.remove();
    const message = err && err.message ? err.message : "Une erreur est survenue. Réessayez.";
    ASSISTANT.addMessage("bot", "⚠️ " + message);
    addBubble("bot", "⚠️ " + message, new Date().toISOString());
  } finally {
    input.disabled = false;
    sendButton.disabled = false;
    sendButton.textContent = "➤";
    input.focus();
  }
}

document.getElementById("btnSend").addEventListener("click", send);
document.getElementById("input").addEventListener("keypress", e => { if (e.key === "Enter") send(); });

// Suggestions
const sugBox = document.getElementById("suggestions");
ASSISTANT.suggestions.forEach(s => {
  const b = document.createElement("button");
  b.textContent = s;
  b.onclick = () => { document.getElementById("input").value = s; send(); };
  sugBox.appendChild(b);
});

// Reconnaissance vocale
document.getElementById("btnVoice").addEventListener("click", () => {
  const btn = document.getElementById("btnVoice");
  btn.classList.add("listening");
  btn.textContent = "🔴";
  ASSISTANT.startVoice(
    txt => { 
      document.getElementById("input").value = txt; 
      btn.classList.remove("listening"); btn.textContent = "🎙️"; 
      send();
    },
    err => { 
      alert("Erreur vocale: " + err); 
      btn.classList.remove("listening"); btn.textContent = "🎙️"; 
    }
  );
});

// Lecture auto
document.getElementById("btnSpeakToggle").addEventListener("click", () => {
  speakAuto = !speakAuto;
  document.getElementById("btnSpeakToggle").textContent = speakAuto ? "🔊 Lecture auto : ON" : "🔊 Lecture auto : OFF";
  if (!speakAuto) ASSISTANT.stopSpeaking();
});

// Nouvelle conversation
document.getElementById("btnNewChat").addEventListener("click", () => {
  if (confirm("Effacer la conversation actuelle ?")) {
    ASSISTANT.clearConversation();
    render();
  }
});

// Export
document.getElementById("btnExportChat").addEventListener("click", () => {
  const conv = ASSISTANT.loadConversation();
  let txt = "=== CONVERSATION INSPECTEURBOT IA RDC ===\n\n";
  conv.forEach(m => {
    txt += `[${new Date(m.ts).toLocaleString("fr-FR")}] ${m.role.toUpperCase()}: ${m.text}\n\n`;
  });
  const blob = new Blob([txt], {type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `conversation_${Date.now()}.txt`;
  a.click();
});

render();
</script>
</body>
</html>
