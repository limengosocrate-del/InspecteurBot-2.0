name: Deploy optimized GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: optimized-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare optimized static site
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p "$RUNNER_TEMP/pages-site"
          tar --exclude='.git' --exclude='.github' --exclude='node_modules' -cf - . | tar -xf - -C "$RUNNER_TEMP/pages-site"
          for extension in jpg jpeg; do
            while IFS= read -r -d '' image; do
              extension_name="${image##*.}"
              optimized="${image%.*}.optimized.${extension_name}"
              if magick "$image" -strip -resize '1920x1920>' -quality 82 "$optimized"; then
                mv "$optimized" "$image"
              else
                rm -f "$optimized"
                echo "::warning::Image JPEG conservée sans modification car elle est illisible par ImageMagick: $image"
              fi

              # Variante WebP servie automatiquement par le service worker.
              # Le JPEG original reste disponible comme solution de secours.
              webp="${image%.*}.webp"
              if magick "$image" -strip -resize '1600x1600>' -quality 78 "$webp"; then
                echo "Variante WebP créée : $webp"
              else
                rm -f "$webp"
                echo "::warning::Variante WebP non créée, JPEG conservé : $image"
              fi
            done < <(find "$RUNNER_TEMP/pages-site" -type f -iname "*.$extension" -print0)
          done
          touch "$RUNNER_TEMP/pages-site/.nojekyll"
          echo "Taille du site optimisé :"
          du -sh "$RUNNER_TEMP/pages-site"

      - name: Upload optimized Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
