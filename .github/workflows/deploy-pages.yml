name: Deploy optimized GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare optimized static site
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p "$RUNNER_TEMP/pages-site"
          tar --exclude='.git' --exclude='.github' --exclude='node_modules' -cf - . | tar -xf - -C "$RUNNER_TEMP/pages-site"
          find "$RUNNER_TEMP/pages-site" -type f \\( -iname '*.jpg' -o -iname '*.jpeg' \\) -print0 |
            xargs -0 -r -n 1 -P 2 magick mogrify -strip -resize '1920x1920>' -quality 82
          touch "$RUNNER_TEMP/pages-site/.nojekyll"
          echo "Taille du site optimisé :"
          du -sh "$RUNNER_TEMP/pages-site"

      - name: Upload optimized Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
