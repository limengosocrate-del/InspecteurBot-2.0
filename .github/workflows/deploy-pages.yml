name: Deploy InspecteurBot GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pages-site"
          tar --exclude='.git' --exclude='.github' --exclude='node_modules' -cf - . | tar -xf - -C "${RUNNER_TEMP}/pages-site"
          touch "${RUNNER_TEMP}/pages-site/.nojekyll"
          test -s "${RUNNER_TEMP}/pages-site/index.html"
          test -s "${RUNNER_TEMP}/pages-site/auth-gate.js"
          test -s "${RUNNER_TEMP}/pages-site/app-version.json"
          echo "Contenu prêt pour GitHub Pages :"
          du -sh "${RUNNER_TEMP}/pages-site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
