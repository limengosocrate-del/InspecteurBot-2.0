<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Conventions collectives</title>
  <link rel="stylesheet" href="../fiche.css?v=41">

<!-- InspecteurBot : authentification obligatoire Supabase -->
<style id="inspecteurbot-auth-lock">
html:not(.inspecteur-auth-ready) body>*:not(#ib-auth-gate):not(#ib-startup-splash){visibility:hidden!important}
html:not(.inspecteur-auth-ready) body::before{content:"InspecteurBot";position:fixed;inset:0;z-index:2147482998;display:grid;place-items:center;padding:0 20px 74px;background:radial-gradient(circle at 50% 35%,#123f70 0%,#071b34 58%,#031126 100%);color:#fff;font:800 clamp(30px,7vw,44px) Arial,sans-serif;letter-spacing:.2px;visibility:visible!important}
html:not(.inspecteur-auth-ready) body::after{content:"";position:fixed;left:calc(50% - 16px);top:calc(50% + 16px);z-index:2147482998;width:28px;height:28px;border:3px solid #ffffff40;border-top-color:#ffd700;border-radius:50%;animation:ib-first-paint-spin .8s linear infinite;visibility:visible!important}
@keyframes ib-first-paint-spin{to{transform:rotate(360deg)}}
html.inspecteur-auth-ready body::before,html.inspecteur-auth-ready body::after{display:none!important}
</style>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin>
<script src="../auth-gate.js?v=20261112-passkey-v1" defer></script>
<style id="inspecteurbot-touch-scroll">html,body{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important;touch-action:pan-y!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior-y:auto!important;scroll-behavior:auto!important}body{position:relative!important;min-height:100vh!important}@media(max-width:760px){body{min-height:100dvh!important}}</style>
</head>
<body>
  <div class="background"></div>
  <div class="page">
    <a class="back-link" href="../index.html">← Tableau de bord</a>
    <h1 style="color:var(--gold)">📘 Conventions collectives</h1>
    <p style="color:var(--muted);margin:8px 0 14px">Les CC peuvent être plus favorables que la loi — jamais en deçà du SMIG / ordre public social.</p>
    <div class="glass">
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
        <button class="btn-gold" id="newConventionBtn" type="button">＋ Nouvelle convention</button>
        <span style="color:var(--muted);font-size:12px;align-self:center">Vos projets sont enregistrés uniquement sur cet appareil et dans votre compte.</span>
      </div>
      <form id="newConventionForm" hidden style="display:grid;gap:10px;margin:12px 0;padding:14px;border:1px solid var(--glass-border);border-radius:12px">
        <label>Intitulé de la convention<input id="ccTitle" required maxlength="160" placeholder="Ex. Convention collective de l'entreprise"></label>
        <label>Secteur ou entreprise<input id="ccSector" required maxlength="160" placeholder="Secteur d'activité / entreprise"></label>
        <label>Texte ou dispositions<textarea id="ccText" rows="7" required placeholder="Saisissez les articles, salaires, primes, horaires, congés, préavis et autres clauses…"></textarea></label>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn-gold" type="submit">Enregistrer le projet</button><button class="btn-gold" id="cancelConvention" type="button">Annuler</button></div>
      </form>
      <div id="customConventionList"></div>
      <div id="list"></div>
      <div class="field" style="margin-top:14px">
        <label>Analyser une clause (collez le texte)</label>
        <textarea id="clause" rows="5" placeholder="Ex: préavis cadres = 6 mois…"></textarea>
      </div>
      <button class="btn-gold" id="go" type="button">🤖 Analyser clause vs Code du Travail</button>
      <pre id="out" style="margin-top:12px;white-space:pre-wrap"></pre>
    </div>
  </div>
  <script src="../js/smig-data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/knowledge-base.js"></script>
  <script src="../js/knowledge-base-ext.js"></script>
  <script src="../js/ai-engine.js"></script>
  <script>
    KnowledgeBaseExt.install();
    list.innerHTML = KnowledgeBaseExt.listAll("conventions").map(c => `
      <div style="padding:12px;border-bottom:1px solid var(--glass-border)">
        <strong style="color:var(--gold)">${c.id}</strong> — ${c.secteur}<br>
        <span style="color:var(--muted)">${c.resume}</span>
      </div>`).join("");

    let conventionStorageKey = "inspecteurbot:conventions:local";
    async function initConventionStorage(){
      const client = window.inspecteurBotAuthClient;
      if(client && client.auth){
        try{
          const {data}=await client.auth.getSession();
          const id=data&&data.session&&data.session.user&&data.session.user.id;
          if(id) conventionStorageKey="inspecteurbot:conventions:"+id;
        }catch(e){console.warn("Compte local des conventions indisponible",e);}
      }
      renderCustomConventions();
    }
    function getCustomConventions(){
      try{return JSON.parse(localStorage.getItem(conventionStorageKey)||"[]");}catch(e){return [];}
    }
    function renderCustomConventions(){
      const host=document.getElementById("customConventionList");
      const items=getCustomConventions();
      host.innerHTML="";
      if(!items.length)return;
      const title=document.createElement("h3");
      title.textContent="Mes projets de conventions";
      title.style.margin="12px 0";
      host.appendChild(title);
      items.forEach(item=>{
        const card=document.createElement("article");
        card.style.cssText="padding:14px;margin:10px 0;border:1px solid var(--glass-border);border-radius:12px";
        const heading=document.createElement("strong");
        heading.textContent=item.title+" — "+item.sector;
        const body=document.createElement("p");
        body.style.cssText="white-space:pre-wrap;color:var(--muted);margin-top:8px";
        body.textContent=item.text;
        const date=document.createElement("small");
        date.textContent="Projet local • "+new Date(item.createdAt).toLocaleString("fr-FR");
        card.append(heading,body,date);
        host.appendChild(card);
      });
    }
    const conventionForm=document.getElementById("newConventionForm");
    document.getElementById("newConventionBtn").onclick=()=>{conventionForm.hidden=false;document.getElementById("ccTitle").focus();};
    document.getElementById("cancelConvention").onclick=()=>{conventionForm.reset();conventionForm.hidden=true;};
    conventionForm.addEventListener("submit",event=>{
      event.preventDefault();
      const item={id:Date.now(),title:document.getElementById("ccTitle").value.trim(),sector:document.getElementById("ccSector").value.trim(),text:document.getElementById("ccText").value.trim(),createdAt:new Date().toISOString()};
      if(!item.title||!item.sector||!item.text)return;
      const items=getCustomConventions();items.unshift(item);
      localStorage.setItem(conventionStorageKey,JSON.stringify(items));
      conventionForm.reset();conventionForm.hidden=true;renderCustomConventions();
      alert("Projet de convention enregistré localement pour votre compte.");
    });
    document.addEventListener('DOMContentLoaded', initConventionStorage, {once:true});
    go.onclick = () => {
      const t = clause.value.trim();
      if (!t) return;
      const analysis = InspecteurAI.analyzeDocument(t);
      const legal = KnowledgeBase.search(t);
      out.textContent = analysis.summary + "\n" + analysis.findings.map(f => f.msg).join("\n") +
        "\n\n" + legal.answer + "\n\n" +
        InspecteurAI.ask("Cette clause de convention collective est-elle plus favorable que le Code du Travail RDC ? " + t).text;
    };
  </script>
</body>
</html>
