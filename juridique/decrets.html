<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Décrets – Bibliothèque juridique</title>
  <link rel="stylesheet" href="../fiche.css?v=41">

<!-- InspecteurBot : authentification obligatoire Supabase -->
<style id="inspecteurbot-auth-lock">
html:not(.inspecteur-auth-ready) body>*:not(#ib-auth-gate):not(#ib-startup-splash){visibility:hidden!important}
html:not(.inspecteur-auth-ready) body::before{content:"InspecteurBot";position:fixed;inset:0;z-index:2147482998;display:grid;place-items:center;padding:0 20px 74px;background:radial-gradient(circle at 50% 35%,#123f70 0%,#071b34 58%,#031126 100%);color:#fff;font:800 clamp(30px,7vw,44px) Arial,sans-serif;letter-spacing:.2px;visibility:visible!important}
html:not(.inspecteur-auth-ready) body::after{content:"";position:fixed;left:calc(50% - 16px);top:calc(50% + 16px);z-index:2147482998;width:28px;height:28px;border:3px solid #ffffff40;border-top-color:#ffd700;border-radius:50%;animation:ib-first-paint-spin .8s linear infinite;visibility:visible!important}
@keyframes ib-first-paint-spin{to{transform:rotate(360deg)}}
html.inspecteur-auth-ready body::before,html.inspecteur-auth-ready body::after{display:none!important}
</style>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin>
<script src="../auth-gate.js?v=20261107-stable-29" defer></script>
<style id="inspecteurbot-touch-scroll">html,body{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important;touch-action:pan-y!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior-y:auto!important;scroll-behavior:auto!important}body{position:relative!important;min-height:100vh!important}@media(max-width:760px){body{min-height:100dvh!important}}</style>
</head>
<body>
  <div class="background"></div>
  <div class="page">
    <a class="back-link" href="../index.html">← Tableau de bord</a>
    <h1 style="color:var(--gold)">📜 Décrets</h1>
    <div class="glass" style="margin-top:14px">
      <input id="q" placeholder="Rechercher un décret (SMIG, 25/22…)">
      <button class="btn-gold" id="go" type="button" style="margin-top:10px">Rechercher IA</button>
      <div id="list" style="margin-top:16px"></div>
      <div id="out" class="result-box" style="display:none"></div>
    </div>
  </div>
  <script src="../js/smig-data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/decompte-engine.js"></script>
  <script src="../js/knowledge-base.js"></script>
  <script src="../js/knowledge-base-ext.js"></script>
  <script src="../js/ai-engine.js"></script>
  <script>
    function renderList() {
      KnowledgeBaseExt.install();
      const items = KnowledgeBaseExt.listAll("decrets") || [];
      list.innerHTML = items.map(d => `
        <div class="glass" style="margin-bottom:10px;padding:14px;cursor:pointer" data-id="${d.id}">
          <strong style="color:var(--gold)">Décret n° ${d.id}</strong> — ${d.date}<br>
          <span>${d.titre}</span>
          <ul style="margin-top:8px;color:var(--muted)">${(d.points||[]).map(p=>`<li>${p}</li>`).join("")}</ul>
        </div>`).join("");
      list.querySelectorAll("[data-id]").forEach(el => el.onclick = () => {
        q.value = "Décret " + el.getAttribute("data-id");
        run();
      });
    }
    function run() {
      KnowledgeBaseExt.install();
      const r = KnowledgeBase.search(q.value || "décret SMIG 25/22");
      const ai = InspecteurAI.ask(q.value || "Explique le décret 25/22 SMIG");
      out.style.display = "block";
      out.innerHTML = `<pre>${r.answer}</pre><hr style="border-color:var(--glass-border);margin:12px 0"><pre>${ai.text}</pre>`;
    }
    go.onclick = run;
    q.addEventListener("keydown", e => e.key === "Enter" && run());
    renderList();
  </script>
</body>
    </html>
