<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion des Inspections</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- InspecteurBot : authentification obligatoire Supabase -->
<style id="inspecteurbot-auth-lock">
html:not(.inspecteur-auth-ready) body>*:not(#ib-auth-gate):not(#ib-startup-splash){visibility:hidden!important}
html:not(.inspecteur-auth-ready) body::before{content:"InspecteurBot";position:fixed;inset:0;z-index:2147482998;display:grid;place-items:center;padding:0 20px 74px;background:radial-gradient(circle at 50% 35%,#123f70 0%,#071b34 58%,#031126 100%);color:#fff;font:800 clamp(30px,7vw,44px) Arial,sans-serif;letter-spacing:.2px;visibility:visible!important}
html:not(.inspecteur-auth-ready) body::after{content:"";position:fixed;left:calc(50% - 16px);top:calc(50% + 16px);z-index:2147482998;width:28px;height:28px;border:3px solid #ffffff40;border-top-color:#ffd700;border-radius:50%;animation:ib-first-paint-spin .8s linear infinite;visibility:visible!important}
@keyframes ib-first-paint-spin{to{transform:rotate(360deg)}}
html.inspecteur-auth-ready body::before,html.inspecteur-auth-ready body::after{display:none!important}
</style>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin>
<script src="auth-gate.js?v=20261107-stable-29" defer></script>
</head>

<body>

<div class="main-content">

<section class="dashboard-section">

<h2>
<i class="fa-solid fa-clipboard-check"></i>
GESTION DES INSPECTIONS
</h2>

<div class="chart-box">

<h3>Nouvelle Inspection</h3>

<form id="formInspection">

<input
type="text"
id="entreprise"
placeholder="Nom de l'entreprise"
required>

<input
type="date"
id="date"
required>

<input
type="text"
id="inspecteur"
placeholder="Nom de l'inspecteur"
required>

<select id="type" required>

<option value="">
Choisir le type d'inspection
</option>

<option>
Inspection ordinaire
</option>

<option>
Inspection inopinée
</option>

<option>
Contre-visite
</option>

<option>
Inspection spéciale
</option>

<option>
Inspection de sécurité
</option>

<option>
Inspection du travail des enfants
</option>

<option>
Inspection de conformité au SMIG
</option>

</select>

<button type="submit">
<i class="fa-solid fa-floppy-disk"></i>
Enregistrer l'inspection
</button>

</form>

</div>

<div class="inspection-list">

<h3>
<i class="fa-solid fa-list"></i>
Liste des Inspections
</h3>

<table>

<thead>

<tr>
<th>N°</th>
<th>Entreprise</th>
<th>Date</th>
<th>Inspecteur</th>
<th>Type</th>
<th>Action</th>
</tr>

</thead>

<tbody id="listeInspections">

</tbody>

</table>

</div>

</section>

</div>

<script>

let inspections =
JSON.parse(
localStorage.getItem("inspections")
) || [];

function afficherInspections(){

let html = "";

inspections.forEach((i,index)=>{

html += `
<tr>

<td>${index + 1}</td>

<td>${i.entreprise}</td>

<td>${i.date}</td>

<td>${i.inspecteur}</td>

<td>${i.type}</td>

<td>

<button
onclick="supprimerInspection(${index})">

<i class="fa-solid fa-trash"></i>
Supprimer

</button>

</td>

</tr>
`;

});

document.getElementById(
"listeInspections"
).innerHTML = html;

}

document.getElementById(
"formInspection"
).addEventListener(
"submit",
function(e){

e.preventDefault();

inspections.push({

entreprise:
document.getElementById(
"entreprise"
).value,

date:
document.getElementById(
"date"
).value,

inspecteur:
document.getElementById(
"inspecteur"
).value,

type:
document.getElementById(
"type"
).value

});

localStorage.setItem(
"inspections",
JSON.stringify(inspections)
);

this.reset();

afficherInspections();

});

function supprimerInspection(index){

if(confirm(
"Supprimer cette inspection ?"
)){

inspections.splice(index,1);

localStorage.setItem(
"inspections",
JSON.stringify(inspections)
);

afficherInspections();

}

}

afficherInspections();

</script>

</body>
</html>
