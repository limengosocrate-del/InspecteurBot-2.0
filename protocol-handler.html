<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#041c5c"><title>Lien InspecteurBot</title><style>body{font-family:Arial,sans-serif;background:#041c5c;color:white;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}main{max-width:480px;padding:25px;border-radius:18px;background:#ffffff12}a{display:inline-block;padding:12px 16px;background:#ffd700;color:#041c5c;border-radius:10px;text-decoration:none;font-weight:bold}</style></head><body><main><h1>InspecteurBot</h1><p id="message">Ouverture du lien…</p><a href="./index.html">Ouvrir InspecteurBot</a></main><script>const p=new URLSearchParams(location.search);let target=p.get('url')||'';try{target=decodeURIComponent(target)}catch(e){}const el=document.getElementById('message');if(/^https:\/\//i.test(target)){el.textContent='Lien externe reçu : '+target;const a=document.createElement('a');a.href=target;a.textContent='Ouvrir le lien';a.rel='noopener';el.after(a)}else{el.textContent='Le lien reçu n’est pas reconnu. Ouvrez InspecteurBot depuis le bouton ci-dessous.'}</script></body></html>
